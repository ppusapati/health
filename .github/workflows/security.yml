# Security scanning gates (SRS-SEC-003, SRS-SEC-006).
#
# SRS-SEC-006 requires SBOM generation plus dependency, container, IaC, SAST
# and secret scanning in the pipeline, with critical findings blocking release
# "unless formally risk accepted". Two design consequences follow:
#
#   1. Every scanner here fails the build on a critical finding. A scan that
#      only uploads a report is not a gate, and this file is the gate.
#   2. "Formally risk accepted" is a file, not a conversation: an exception
#      lives in code/security/risk-acceptances.yaml with an owner, a
#      justification and an expiry date, and code/tools/security enforces that
#      shape. An acceptance that outlives its expiry fails the build, so a
#      temporary exception cannot quietly become permanent.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Dependency advisories are published against code that has not changed, so
  # the scans have to run on a clock as well as on a diff.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  GITLEAKS_VERSION: v8.21.2
  TRIVY_VERSION: v0.58.1
  SYFT_VERSION: v1.18.1
  GOSEC_VERSION: v2.21.4

jobs:
  risk-acceptances:
    name: Risk acceptance register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      # Runs first: the register is what every other job in this workflow
      # defers to, so a malformed or expired entry should be reported as
      # itself rather than as a mysterious scanner failure.
      - run: make test-security
        working-directory: code

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked
          # secret, and SRS-SEC-003 asks for commits to be blocked.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --config code/.gitleaks.toml --redact --exit-code 1 --verbose

  sast:
    name: Static application security testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      # Generated code is excluded: it is a build artifact regenerated by
      # `make generate`, so a finding there is a finding against the plugin,
      # not against this repository, and cannot be fixed here.
      - name: Run gosec
        working-directory: code
        run: |
          gosec -severity medium -confidence medium \
            -exclude-dir=gen \
            -exclude-dir=internal/platform/sqlcgen \
            -exclude-generated \
            ./...

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # govulncheck reports only vulnerabilities the build actually reaches,
      # so a finding here is exploitable code rather than a version string.
      - name: Scan Go dependencies
        working-directory: code
        run: govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/apps/web/package-lock.json
      - name: Scan web dependencies
        working-directory: code/apps/web
        run: npm audit --audit-level=high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
      # CycloneDX, because the downstream consumers of an SBOM in this
      # programme (vulnerability correlation, customer security reviews) expect
      # it and it carries component licences.
      - name: Generate SBOM
        run: syft dir:code -o cyclonedx-json=sbom.cdx.json
      - name: Publish SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          # Retained past the release window: an SBOM is evidence, and it is
          # needed most when an advisory lands months after the build.
          retention-days: 90

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f code/infra/docker/core.Dockerfile \
            --build-arg VERSION=scan \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t core:scan code
      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Scan image
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH \
            --ignorefile code/.trivyignore \
            --ignore-unfixed core:scan

  iac:
    name: Infrastructure as code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      # Scans the manifests as written. tools/infra asserts the invariants this
      # programme cares about; trivy catches the generic misconfigurations
      # nobody thought to write an invariant for.
      - name: Scan manifests and Dockerfiles
        run: |
          trivy config --exit-code 1 --severity CRITICAL,HIGH \
            --ignorefile code/.trivyignore \
            code/infra
