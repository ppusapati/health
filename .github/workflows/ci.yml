# Continuous integration for the implementation monorepo.
#
# The job set mirrors the Engineering Architecture Blueprint §17 quality gates
# and the Wave-0 exit criteria: formatting and static analysis, deterministic
# code generation, protobuf compatibility, unit and repository-integration
# tests against a real PostgreSQL, and the architecture fitness tests that hold
# Gate A10.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  BUF_VERSION: v1.47.2
  SQLC_VERSION: v1.28.0

defaults:
  run:
    working-directory: code

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      - run: make fmt-check
      - run: make vet
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  generated-code:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      - name: Install codegen tools
        run: make tools
      - name: Lint protobuf
        run: make proto-lint
      # Generated clients are build artifacts, never hand-edited (SRS-API-001).
      # Regenerating and diffing is what keeps that true.
      - name: Regenerate and diff
        run: make generate-check

  proto-compatibility:
    name: Protobuf backward compatibility
    runs-on: ubuntu-latest
    # Only meaningful against an existing baseline, so pull requests only.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      - run: go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
      # SRS-API-002: evolution is additive by default; a breaking change has to
      # be a deliberate new package version.
      # ../.git, not .git: this job runs in code/ but the repository root is one
      # level up. With the wrong path buf cannot clone and this gate never runs.
      - name: Check for breaking changes
        run: buf breaking --against '../.git#branch=origin/main,subdir=code'

  contract:
    name: API contract semantics
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      # SRS-API-013: buf breaking holds the wire shape; this holds the
      # behaviour it cannot see — which permission an RPC needs and which
      # status it answers with when refused. A handler can change NOT_FOUND to
      # PERMISSION_DENIED without touching a byte of the proto, and that change
      # is a security change.
      - name: Contract tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./internal/app/ -run Contract -count=1 -v

  fitness:
    name: Architecture fitness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      # Gate A10: forbidden dependency direction and cross-schema access fail
      # the build rather than the code review.
      - run: make test-fitness
      # Schema change rules: expand/contract, rollback and reconciliation
      # notes, and the partitioning register (SRS-DAT-006, 010, 013).
      - run: make test-migrations

  test:
    name: Tests with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      # Repository tests run against a real database: constraints, SQLSTATE
      # codes and transaction semantics are what mocks get wrong.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -race -count=1

  manifests:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: code/go.sum
      # Invariants first: they run without a cluster and name the rule broken.
      - run: make test-infra
      - name: Install manifest tooling
        run: make infra-tools
      # Then schema-validate the rendered output, which catches mistakes the
      # invariants do not model, such as a misspelled API version.
      - run: make manifests-validate

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f code/infra/docker/core.Dockerfile \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t core:ci code

  mobile:
    name: Mobile workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: code/apps/mobile
      # The Dart client is a build artifact of proto/, never hand-edited
      # (SRS-API-001, Gate A9). It drifted silently through all of Wave 1
      # because nothing regenerated it, so the check lives beside the toolchain
      # that can actually run it rather than in the Go generated-code job.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
      - run: dart pub global activate protoc_plugin
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Regenerate the Dart client and diff
        run: make mobile-generate-check
        working-directory: code
      - run: flutter analyze
        working-directory: code/apps/mobile
      - run: flutter test
        working-directory: code/apps/mobile

  web:
    name: Web workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/apps/web/package-lock.json
      - run: npm ci
        working-directory: code/apps/web
      # Same reason as the mobile job: the TypeScript client is generated from
      # proto/ and nothing was regenerating it.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
      - name: Regenerate the TypeScript client and diff
        run: make web-generate-check
        working-directory: code
      - run: npm run check
        working-directory: code/apps/web
      - run: npm test
        working-directory: code/apps/web

  browser:
    name: Accessibility and cross-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/apps/web/package-lock.json
      - run: npm ci
        working-directory: code/apps/web
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: code/apps/web
      # SRS-WEB-009 and SRS-NFR-007: WCAG 2.2 AA as a gate, not a report. An
      # accessibility scan whose output nobody is accountable for is how a
      # product ships at AA on paper and at nothing in practice.
      - name: Accessibility (WCAG 2.2 AA)
        run: npm run test:a11y
        working-directory: code/apps/web
      # SRS-NFR-014: the published support matrix, exercised rather than
      # asserted.
      - name: Cross-browser smoke
        run: npm run test:browsers
        working-directory: code/apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: code/apps/web/playwright-report/
          retention-days: 7
