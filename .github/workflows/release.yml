# Release: build, sign, attest, verify (P0-11, SRS-SEC-006).
#
# The CI workflow builds the image to prove it builds. This one produces the
# artefact that actually ships, and everything here exists to make one claim
# checkable months later: *this* digest was built from *that* commit by *this*
# workflow.
#
# Three properties, in the order they matter:
#
#   1. The image is addressed by digest from the moment it is pushed. A tag is a
#      mutable pointer and cannot be the subject of a signature.
#   2. Signing is keyless. There is no key to store, rotate or leak — the signer
#      identity is this workflow, proven by GitHub's OIDC token and recorded in
#      Sigstore's public transparency log.
#   3. The workflow verifies its own output before finishing. A signing step
#      whose result nobody checks is a step that can silently stop working, and
#      the failure would surface at a cluster admission months later.
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs are for rehearsing the pipeline. They sign nothing, because the
  # admission policy trusts only signatures made from a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/core
  COSIGN_VERSION: v2.4.1
  SYFT_VERSION: v1.18.1

jobs:
  release:
    name: Build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Both are required for keyless signing: id-token mints the OIDC token
      # that becomes the signer identity, attestations writes the provenance.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      # The digest this step outputs is the subject of everything below. Tags
      # are published for humans; nothing in the verification chain uses them.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/infra/docker/core.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # SLSA provenance answers a different question from the signature. The
      # signature says "this workflow published it"; provenance says which
      # commit, which runner and which workflow run produced it — which is what
      # an incident review needs.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      # The SBOM is generated from the image that shipped, not from the source
      # tree. They differ: the source tree does not know what the base layer
      # contains, and that is where a CVE most often lives.
      - name: Generate SBOM for the released image
        run: |
          syft "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            -o cyclonedx-json=sbom.cdx.json
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Attest the SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 365

  verify:
    name: Verify the release verifies
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # This job is the point of the workflow.
      #
      # A signature nobody checks is a signature that can silently stop being
      # produced — a renamed workflow file, a dropped permission, a changed
      # identity — and the first sign of trouble would be a cluster refusing to
      # admit a pod during a release. Verifying here, with the same identity the
      # admission policy uses, moves that discovery to the pipeline.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ needs.release.outputs.digest }}

      - name: Verify build provenance
        run: |
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ needs.release.outputs.digest }}

      # The digest an operator pins in the overlay. Printed rather than
      # committed: which environment takes which release is a deployment
      # decision, and a pipeline that edits prod manifests makes it silently.
      - name: Report the digest to pin
        run: |
          echo "Pin this in the overlay's kustomization images block:"
          echo "  ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
