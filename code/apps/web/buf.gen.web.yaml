# TypeScript client generation for the web workspace.
#
# The browser consumes the same canonical protobuf contracts as the Go service
# and the Flutter apps (SRS-WEB-002, Gate A9). Handwritten wire types are
# prohibited: this output is a build artifact.
version: v2
inputs:
  - directory: ../../proto
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/lib/gen
    opt:
      - target=ts
      - import_extension=js
