# A PostgreSQL for the cluster deploy check. Development only.
#
# Not part of any overlay and deliberately not in infra/k8s/base: production
# runs a managed database, and a Deployment with an emptyDir is the wrong shape
# for anything holding a patient record. It lives here so scripts/cluster/
# deploy-check.sh has something for the workload to talk to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    # Not shipped by the release pipeline. Exempts this from digest pinning,
    # the release registry and the zero-downtime rollout rule — and from
    # nothing else: every security invariant in tools/infra still applies, and
    # the namespace enforces Pod Security "restricted" against it.
    health.dev/fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The namespace enforces Pod Security "restricted", and this has to
      # satisfy it like anything else — a test fixture exempted from the policy
      # would be a hole the policy does not cover. tools/infra holds it to the
      # same invariants as the shipped workloads, and caught this file the
      # first time it was added.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # A local re-tag of postgres:16-alpine. Side-loaded with `kind load`,
          # because the node has no route to a registry: the sandbox's egress
          # proxy listens on the host's loopback, a different namespace.
          image: local/postgres:16
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # TLS, because the binary refuses any sslmode below verify-ca and it
          # is right to: "require" encrypts without authenticating the server,
          # which stops passive capture and not an attacker who can answer for
          # the database. A check that turned that off to go green would be
          # checking nothing.
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: core
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "core"]
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            # readOnlyRootFilesystem, so every path the image writes to needs a
            # volume. These are the ones the entrypoint and the server touch.
            - name: tmp
              mountPath: /tmp
      volumes:
        # Deliberately ephemeral: this database exists for the length of a
        # check, and anything that survived it would make the next run's
        # results depend on the last one's.
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: postgres-tls
            # PostgreSQL refuses a key group- or world-readable, and the
            # container runs as 999, so the key is mounted 0600 owned by the
            # fsGroup rather than the default 0644.
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
