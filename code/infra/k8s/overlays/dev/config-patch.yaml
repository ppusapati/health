apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
data:
  LOG_LEVEL: "debug"
  # The development verifier is enabled here and nowhere else. AUTH_MODE has no
  # base default, so no overlay can inherit this by accident (ADR-W0-003).
  AUTH_MODE: "dev"
  ENVIRONMENT: "development"
  # TLS_MODE has no base default for the same reason AUTH_MODE has none: the
  # environment that forgets to set it is the one least likely to notice a
  # plaintext channel (SRS-SEC-001).
  TLS_MODE: "mesh"
  # Binary content goes to a filesystem in development. Not replicated and not
  # encrypted by the process — honest for a single pod, and wrong for anything
  # with a second availability zone, which is why production names an object
  # store instead (ADR-W1-009).
  BLOB_BACKENDS: "local"
  BLOB_BACKEND_LOCAL_KIND: "filesystem"
  BLOB_BACKEND_LOCAL_ROOT: "/var/lib/health/blobs"
