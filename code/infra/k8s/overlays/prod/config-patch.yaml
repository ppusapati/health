apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
data:
  LOG_LEVEL: "info"
  AUTH_MODE: "oidc"
  ENVIRONMENT: "production"
  # TLS_MODE has no base default for the same reason AUTH_MODE has none: the
  # environment that forgets to set it is the one least likely to notice a
  # plaintext channel (SRS-SEC-001).
  TLS_MODE: "mesh"
