apiVersion: v1
kind: ServiceAccount
metadata:
  name: core
  namespace: healthcare
  labels:
    app.kubernetes.io/name: core
    app.kubernetes.io/part-of: unified-healthcare-saas
# The pod does not call the Kubernetes API, so it gets no token. Mounting one
# by default hands any RCE a cluster credential for free.
automountServiceAccountToken: false
