# Nightly logical backup with an immediate restore verification.
#
# SRS-NFR-016 is explicit that a successful backup is not evidence of anything:
# only a tested restore is. This job therefore dumps, restores into a scratch
# database and compares row counts, failing loudly if the restore does not
# reproduce the source.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: core-backup-verify
  namespace: healthcare
  labels:
    app.kubernetes.io/name: core-backup
  annotations:
    healthcare.io/owning-team: platform
    healthcare.io/runbook: https://github.com/ppusapati/health/blob/main/code/docs/engineering/runbooks/backup-restore.md
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: core
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # postgres:16-alpine, pinned by digest.
              #
              # This container runs the restore-verification (SRS-NFR-016): it
              # restores the dump into a scratch database and compares row
              # counts. A floating tag means the tool that proves the backup is
              # restorable can change between the drill that passed and the
              # night it is needed — and pg_restore is exactly the tool where a
              # minor-version difference matters.
              #
              # Resolved from docker.io/library/postgres:16-alpine. Bump it
              # deliberately, and re-run the drill after.
              image: docker.io/library/postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
              command: ["/bin/sh", "/scripts/backup-verify.sh"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      # Not core-database. This job creates a scratch database
                      # to restore into, so its credential needs CREATEDB, and
                      # the application's credential must not have it.
                      name: core-backup-database
                      key: url
                - name: BACKUP_DESTINATION
                  valueFrom:
                    secretKeyRef:
                      name: core-backup
                      key: destination
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
            - name: work
              emptyDir: {}
