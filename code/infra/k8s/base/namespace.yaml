apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
  labels:
    app.kubernetes.io/part-of: unified-healthcare-saas
    # Pod Security Admission at the namespace level: a workload that tries to
    # run privileged is rejected by the API server, not merely discouraged.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
