  InfectionSite site = 3;
  string location_id = 4;
  google.protobuf.Timestamp onset_from = 5;
  google.protobuf.Timestamp onset_to = 6;
  int32 page_size = 7;
  int32 page_offset = 8;
}

message ListCasesResponse {
  repeated SurveillanceCase cases = 1;
}

message RecordDeviceDaysRequest {
