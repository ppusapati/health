}

message ListCorrectiveActionsRequest {
  string sample_id = 1;
  bool open_only = 2;
}

message ListCorrectiveActionsResponse {
  repeated CorrectiveAction actions = 1;
}

message GetEnvironmentSummaryRequest {
  string location_id = 1;
  google.protobuf.Timestamp period_from = 2;
  google.protobuf.Timestamp period_to = 3;
}

message GetEnvironmentSummaryResponse {
  EnvironmentSummary summary = 1;
}

service InfectionService {
  // Surveillance and rates (SRS-IPC-001, SRS-IPC-002, SRS-IPC-010).
  rpc OpenCase(OpenCaseRequest) returns (OpenCaseResponse);
  rpc ReviewCase(ReviewCaseRequest) returns (ReviewCaseResponse);
  rpc OverrideOnset(OverrideOnsetRequest) returns (OverrideOnsetResponse);
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc RecordDeviceDays(RecordDeviceDaysRequest) returns (RecordDeviceDaysResponse);
  rpc GetRate(GetRateRequest) returns (GetRateResponse);

  // Isolation and the bed board (SRS-IPC-003).
  rpc StartIsolation(StartIsolationRequest) returns (StartIsolationResponse);
  rpc ExtendIsolation(ExtendIsolationRequest) returns (ExtendIsolationResponse);
  rpc EndIsolation(EndIsolationRequest) returns (EndIsolationResponse);
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);

  // Multidrug-resistant organism alerting (SRS-IPC-004).
  rpc DraftAlertRule(DraftAlertRuleRequest) returns (DraftAlertRuleResponse);
  rpc ApproveAlertRule(ApproveAlertRuleRequest) returns (ApproveAlertRuleResponse);
  rpc ScreenEncounter(ScreenEncounterRequest) returns (ScreenEncounterResponse);
  rpc AcknowledgeAlert(AcknowledgeAlertRequest) returns (AcknowledgeAlertResponse);
  rpc OverrideAlert(OverrideAlertRequest) returns (OverrideAlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);

  // Outbreak investigation (SRS-IPC-005).
  rpc OpenOutbreak(OpenOutbreakRequest) returns (OpenOutbreakResponse);
  rpc AdvanceOutbreak(AdvanceOutbreakRequest) returns (AdvanceOutbreakResponse);
  rpc CloseOutbreak(CloseOutbreakRequest) returns (CloseOutbreakResponse);
  rpc AddOutbreakMember(AddOutbreakMemberRequest) returns (AddOutbreakMemberResponse);
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  rpc ListOutbreaks(ListOutbreaksRequest) returns (ListOutbreaksResponse);

  // Hand hygiene audit (SRS-IPC-006).
  rpc StartHygieneSession(StartHygieneSessionRequest) returns (StartHygieneSessionResponse);
  rpc RecordObservation(RecordObservationRequest) returns (RecordObservationResponse);
  rpc EndHygieneSession(EndHygieneSessionRequest) returns (EndHygieneSessionResponse);
  rpc GetHygieneCompliance(GetHygieneComplianceRequest) returns (GetHygieneComplianceResponse);

  // Occupational exposure (SRS-IPC-007).
  rpc ReportExposure(ReportExposureRequest) returns (ReportExposureResponse);
  rpc GetExposure(GetExposureRequest) returns (GetExposureResponse);
  rpc CompleteExposureTask(CompleteExposureTaskRequest) returns (CompleteExposureTaskResponse);
  rpc CloseExposure(CloseExposureRequest) returns (CloseExposureResponse);
  rpc ListExposures(ListExposuresRequest) returns (ListExposuresResponse);
  rpc SweepExposureTasks(SweepExposureTasksRequest) returns (SweepExposureTasksResponse);

  // Antimicrobial stewardship (SRS-IPC-008). Nothing here changes a
  // prescription.
  rpc DraftStewardshipRule(DraftStewardshipRuleRequest) returns (DraftStewardshipRuleResponse);
  rpc ApproveStewardshipRule(ApproveStewardshipRuleRequest) returns (ApproveStewardshipRuleResponse);
  rpc ReviewEncounter(ReviewEncounterRequest) returns (ReviewEncounterResponse);
  rpc AdviseReview(AdviseReviewRequest) returns (AdviseReviewResponse);
  rpc RespondToReview(RespondToReviewRequest) returns (RespondToReviewResponse);
  rpc WithdrawReview(WithdrawReviewRequest) returns (WithdrawReviewResponse);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc GetStewardshipIndicators(GetStewardshipIndicatorsRequest) returns (GetStewardshipIndicatorsResponse);

  // Environmental surveillance (SRS-IPC-009).
  rpc DraftLimit(DraftLimitRequest) returns (DraftLimitResponse);
  rpc ApproveLimit(ApproveLimitRequest) returns (ApproveLimitResponse);
  rpc AddSamplingPlan(AddSamplingPlanRequest) returns (AddSamplingPlanResponse);
  rpc CollectSample(CollectSampleRequest) returns (CollectSampleResponse);
  rpc RecordSampleResult(RecordSampleResultRequest) returns (RecordSampleResultResponse);
  rpc RaiseCorrectiveAction(RaiseCorrectiveActionRequest) returns (RaiseCorrectiveActionResponse);
  rpc CompleteCorrectiveAction(CompleteCorrectiveActionRequest) returns (CompleteCorrectiveActionResponse);
  rpc VerifyCorrectiveAction(VerifyCorrectiveActionRequest) returns (VerifyCorrectiveActionResponse);
  rpc CloseSample(CloseSampleRequest) returns (CloseSampleResponse);
  rpc ListDueSampling(ListDueSamplingRequest) returns (ListDueSamplingResponse);
  rpc ListSamples(ListSamplesRequest) returns (ListSamplesResponse);
  rpc ListCorrectiveActions(ListCorrectiveActionsRequest) returns (ListCorrectiveActionsResponse);
  rpc GetEnvironmentSummary(GetEnvironmentSummaryRequest) returns (GetEnvironmentSummaryResponse);
}
