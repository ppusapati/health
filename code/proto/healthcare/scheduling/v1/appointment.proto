// Scheduling: availability, appointments and the queue.
//
// Owning context : scheduling  (Master Engineering Registry)
// Owning service : AppointmentService
// Trace          : SRS-SCH-001 … SRS-SCH-016
syntax = "proto3";

package healthcare.scheduling.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ppusapati/health/code/gen/go/healthcare/scheduling/v1;schedulingv1";

// What kind of thing is being booked (SRS-SCH-001).
//
// A clinician and an operating theatre are the same thing to a diary: something
// with finite time that two people cannot have at once. A schedule that could
// attach only to a person could not express "this scanner, forty minutes, one
// patient at a time", and a hospital's scarcest resources are usually not
// people.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_PRACTITIONER = 1;
  RESOURCE_TYPE_ROOM = 2;
  RESOURCE_TYPE_EQUIPMENT = 3;
}

enum ResourceStatus {
  RESOURCE_STATUS_UNSPECIFIED = 0;
  RESOURCE_STATUS_ACTIVE = 1;
  // Has left, is out of service, or is not yet in service. Past appointments
  // stay: a clinician who has retired still saw the patients they saw.
  RESOURCE_STATUS_INACTIVE = 2;
}

// What kind of appointment a slot is for.
//
// Part of the roster rather than the booking because the durations differ: a
// new-patient assessment is forty minutes and a follow-up is ten, and a diary
// that let either be booked into either would waste half the clinic or overrun
// it.
enum VisitType {
  VISIT_TYPE_UNSPECIFIED = 0;
  VISIT_TYPE_NEW = 1;
  VISIT_TYPE_FOLLOW_UP = 2;
  VISIT_TYPE_PROCEDURE = 3;
  VISIT_TYPE_TELECONSULT = 4;
  VISIT_TYPE_WALK_IN = 5;
}

// Where the appointment happens (SRS-SCH-015).
enum VisitMode {
  VISIT_MODE_UNSPECIFIED = 0;
  VISIT_MODE_IN_PERSON = 1;
  VISIT_MODE_TELECONSULT = 2;
}

// Why capacity was removed (SRS-SCH-002).
// How the patient got here (SRS-SCH-007). Recorded because it changes what
// happens next: somebody brought in by ambulance is not joining the back of the
// queue, and a remote patient is not in the waiting room at all.
enum ArrivalMode {
  ARRIVAL_MODE_UNSPECIFIED = 0;
  ARRIVAL_MODE_WALK_IN = 1;
  ARRIVAL_MODE_SCHEDULED = 2;
  ARRIVAL_MODE_AMBULANCE = 3;
  ARRIVAL_MODE_REFERRAL = 4;
  ARRIVAL_MODE_TELEHEALTH = 5;
}

// Where a patient sits in the queue (SRS-SCH-010, SRS-SCH-011).
//
// Deliberately coarse. A five-band scale is what triage systems use and what
// staff can hold in their heads; a numeric score invites arithmetic, and
// arithmetic on clinical urgency is how somebody ends up behind a spreadsheet.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  // Cannot wait. Resuscitation.
  PRIORITY_IMMEDIATE = 1;
  PRIORITY_VERY_URGENT = 2;
  PRIORITY_URGENT = 3;
  // The default and most of the list.
  PRIORITY_STANDARD = 4;
  PRIORITY_NON_URGENT = 5;
}

// What a notification is about (SRS-SCH-012).
enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_BOOKED = 1;
  NOTIFICATION_KIND_REMINDER = 2;
  NOTIFICATION_KIND_RESCHEDULED = 3;
  NOTIFICATION_KIND_CANCELLED = 4;
  NOTIFICATION_KIND_WAITLIST_OFFER = 5;
}

// What happened to a message (SRS-SCH-012).
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0;
  // Handed to the notification service and not yet resolved.
  DELIVERY_OUTCOME_PENDING = 1;
  DELIVERY_OUTCOME_SENT = 2;
  // Confirmation from the channel, where the channel offers one. Distinct from
  // sent because "we posted it" and "it arrived" are different claims, and only
  // one of them answers a patient who says they never heard.
  DELIVERY_OUTCOME_DELIVERED = 3;
  DELIVERY_OUTCOME_FAILED = 4;
  // The patient had not agreed to be contacted this way. Recorded rather than
  // silently skipped: "we did not tell them, and here is why" is an answer;
  // silence is not.
  DELIVERY_OUTCOME_SUPPRESSED = 5;
}

enum ExceptionKind {
  EXCEPTION_KIND_UNSPECIFIED = 0;
  EXCEPTION_KIND_LEAVE = 1;
  EXCEPTION_KIND_BLOCK = 2;
  EXCEPTION_KIND_MEETING = 3;
  EXCEPTION_KIND_THEATRE = 4;
  EXCEPTION_KIND_PROCEDURE = 5;
}

// Where an appointment sits in its life (SRS-SCH-008).
//
// Deliberately not a total order. Triage is skipped in an outpatient clinic and
// mandatory in an emergency department; a patient can leave before being seen;
// a consultation can be re-entered because the clinician stepped out for a
// result.
enum AppointmentStatus {
  APPOINTMENT_STATUS_UNSPECIFIED = 0;
  APPOINTMENT_STATUS_SCHEDULED = 1;
  APPOINTMENT_STATUS_ARRIVED = 2;
  APPOINTMENT_STATUS_TRIAGED = 3;
  APPOINTMENT_STATUS_WAITING_CLINICIAN = 4;
  APPOINTMENT_STATUS_IN_CONSULTATION = 5;
  APPOINTMENT_STATUS_POST_CONSULTATION = 6;
  APPOINTMENT_STATUS_COMPLETED = 7;
  APPOINTMENT_STATUS_NO_SHOW = 8;
  APPOINTMENT_STATUS_CANCELLED = 9;
}

message Resource {
  string resource_id = 1;
  string facility_id = 2;
  // The department or specialty, for the "search by specialty" half of
  // SRS-SCH-003 — how a patient books without knowing a clinician's name.
  string org_unit_id = 3;
  ResourceType type = 4;
  // The identity a practitioner's diary belongs to. Empty for a room or a
  // machine, which are nobody.
  string subject_id = 5;
  string display_name = 6;
  ResourceStatus status = 7;
  string time_zone = 8;
}

message Schedule {
  string schedule_id = 1;
  string resource_id = 2;
  string facility_id = 3;
  VisitType visit_type = 4;
  VisitMode visit_mode = 5;
  // 0 is Sunday, matching Go and ISO's weekday-name ordering.
  int32 weekday = 6;
  // Minutes from local midnight. Minutes rather than a time, because a rule has
  // no date and a zero date carrying a time reads as year 1 in every log.
  int32 start_minute = 7;
  int32 end_minute = 8;
  int32 slot_minutes = 9;
  // How many patients one slot holds. More than one is a group clinic or a
  // double-booked follow-up list, both of which are real.
  int32 capacity = 10;
  // Local dates; until is exclusive and unset means open-ended.
  google.protobuf.Timestamp effective_from = 11;
  google.protobuf.Timestamp effective_until = 12;
}

message ScheduleException {
  string exception_id = 1;
  string resource_id = 2;
  ExceptionKind kind = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // What a colleague reads when deciding whether to ask for an override.
  // "Blocked" with no reason gets overridden by default.
  string reason = 6;
  // Annual leave is not overridable; a provisional theatre block often is.
  bool overridable = 7;
  string created_by = 8;
}

// One bookable period. Generated from the roster on every search rather than
// stored, so the result reflects the roster as it is now.
message Slot {
  string resource_id = 1;
  string facility_id = 2;
  string org_unit_id = 3;
  VisitType visit_type = 4;
  VisitMode visit_mode = 5;
  google.protobuf.Timestamp starts_at = 6;
  google.protobuf.Timestamp ends_at = 7;
  int32 capacity = 8;
  int32 booked = 9;
  int32 remaining = 10;
  // Present only for a caller holding the override permission, and only where
  // the block permits an override at all. A scheduler needs to see what they
  // are booking into and why it was blocked.
  bool blocked = 11;
  string blocked_reason = 12;
  ExceptionKind blocked_kind = 13;
}

message StatusChange {
  AppointmentStatus from = 1;
  AppointmentStatus to = 2;
  google.protobuf.Timestamp at = 3;
  string by = 4;
  string reason = 5;
  // A transition the machine would otherwise refuse, made under the "unless
  // authorized correction" clause of SRS-SCH-008.
  bool corrected = 6;
}

message Appointment {
  string appointment_id = 1;
  string facility_id = 2;
  string resource_id = 3;
  string org_unit_id = 4;
  string patient_id = 5;
  VisitType visit_type = 6;
  VisitMode visit_mode = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp ends_at = 9;
  AppointmentStatus status = 10;
  string booked_by = 11;
  // Why the patient is coming, as stated at booking. Short and non-clinical: a
  // diagnosis belongs in the encounter, which far fewer people can see.
  string reason = 12;
  // Every status this appointment has held. SRS-SCH-005 requires it to be
  // retained: a patient disputing a missed-appointment fee needs the record to
  // show when they were marked a no-show and by whom.
  repeated StatusChange history = 13;
  // Chains to the appointment this one replaced, so the chronology survives a
  // reschedule.
  string rescheduled_from_id = 14;
  int64 version = 15;
  // Groups a recurring therapy series (SRS-SCH-013).
  string series_id = 16;
  // This appointment's position in its series, from 1.
  int32 occurrence = 17;
  // How many times this booking has been moved. Carried forward across the
  // chain, because a policy capping reschedules is about the patient rather
  // than about any one row.
  int32 reschedule_count = 18;
  // Where a teleconsult happens (SRS-SCH-015). Empty for an in-person
  // appointment: one carrying a link invites a patient to stay home.
  string join_url = 19;

  // The queue (SRS-SCH-007 … SRS-SCH-011). All empty until the patient
  // arrives: a booking is not a queue entry.

  // What the patient is called by. Not the appointment id: that is a UUID
  // nobody can read out across a noisy waiting room.
  string token = 20;
  ArrivalMode arrival_mode = 21;
  google.protobuf.Timestamp checked_in_at = 22;
  Priority priority = 23;
  // Shown to queue users, not buried in an audit table: the people waiting can
  // see that somebody went ahead of them, and a board that shows the move
  // without the reason produces the argument the reason exists to prevent
  // (SRS-SCH-011).
  string priority_reason = 24;
}

message DefineResourceRequest {
  string facility_id = 1;
  string org_unit_id = 2;
  ResourceType type = 3;
  string subject_id = 4;
  string display_name = 5;
  // An IANA zone. A diary is written in local time and nothing else makes sense
  // to the people reading it.
  string time_zone = 6;
}

message DefineResourceResponse {
  Resource resource = 1;
}

message SetResourceStatusRequest {
  string resource_id = 1;
  ResourceStatus status = 2;
}

message SetResourceStatusResponse {}

message DefineScheduleRequest {
  string resource_id = 1;
  VisitType visit_type = 2;
  VisitMode visit_mode = 3;
  int32 weekday = 4;
  int32 start_minute = 5;
  int32 end_minute = 6;
  int32 slot_minutes = 7;
  int32 capacity = 8;
  google.protobuf.Timestamp effective_from = 9;
  google.protobuf.Timestamp effective_until = 10;
}

message DefineScheduleResponse {
  Schedule schedule = 1;
}

message BlockPeriodRequest {
  string resource_id = 1;
  ExceptionKind kind = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  string reason = 5;
  bool overridable = 6;
}

message BlockPeriodResponse {
  ScheduleException exception = 1;
}

message UnblockPeriodRequest {
  string exception_id = 1;
}

message UnblockPeriodResponse {}

message SearchSlotsRequest {
  string facility_id = 1;
  // The specialty or department, which is how a patient who does not know a
  // clinician's name searches.
  string org_unit_id = 2;
  string resource_id = 3;
  VisitType visit_type = 4;
  VisitMode visit_mode = 5;
  // Local dates; until is exclusive.
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp until = 7;
  int32 page_size = 8;
}

message SearchSlotsResponse {
  repeated Slot slots = 1;
  // The page limit cut the result, so a client can say so rather than implying
  // the clinic has nothing later.
  bool truncated = 2;
}

message BookAppointmentRequest {
  string patient_id = 1;
  // The slot is named by resource, instant and visit type rather than by an
  // opaque id, because slots are generated rather than stored: an id would have
  // to be minted at search time and would be meaningless by the time the
  // patient chose one.
  string resource_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  VisitType visit_type = 4;
  string reason = 5;
  // Book into a blocked period. Needs the override permission, and works only
  // where the block said it was overridable.
  bool override = 6;
}

message BookAppointmentResponse {
  Appointment appointment = 1;
}

message GetAppointmentRequest {
  string appointment_id = 1;
}

message GetAppointmentResponse {
  Appointment appointment = 1;
}

message ListAppointmentsRequest {
  string patient_id = 1;
  string facility_id = 2;
  string resource_id = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp until = 5;
  int32 page_size = 6;
}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
}

// How far a change to a recurring series reaches (SRS-SCH-013).
//
// A physiotherapy course is twelve appointments; the patient asks to move next
// Tuesday, or asks to move every remaining Tuesday, and those are different
// requests. Past occurrences are never touched by either: they happened.
enum SeriesScope {
  SERIES_SCOPE_UNSPECIFIED = 0;
  SERIES_SCOPE_THIS_OCCURRENCE = 1;
  SERIES_SCOPE_FUTURE_OCCURRENCES = 2;
}

enum WaitlistStatus {
  WAITLIST_STATUS_UNSPECIFIED = 0;
  WAITLIST_STATUS_WAITING = 1;
  // Has been shown an earlier slot and has not answered.
  WAITLIST_STATUS_OFFERED = 2;
  WAITLIST_STATUS_ACCEPTED = 3;
  WAITLIST_STATUS_DECLINED = 4;
  WAITLIST_STATUS_EXPIRED = 5;
  WAITLIST_STATUS_WITHDRAWN = 6;
}

// What the policy made of a cancellation or a reschedule (SRS-SCH-005).
//
// Captured at the moment of the decision, so a policy changed in March cannot
// retroactively make a February cancellation late. This system never charges
// anybody: it records whether the notice period was met and leaves the fee to
// SRS-BIL.
message PolicyOutcome {
  bool timely = 1;
  // Stored rather than derived later: "cancelled 23 hours before" is the fact a
  // dispute turns on, and recomputing it from two timestamps months later
  // invites a rounding argument.
  int32 notice_given_minutes = 2;
  int32 notice_required_minutes = 3;
  // Refer to billing. What it costs is SRS-BIL's decision, not this one.
  bool chargeable = 4;
}

message CancelAppointmentRequest {
  string appointment_id = 1;
  string reason = 2;
}

message CancelAppointmentResponse {
  Appointment appointment = 1;
  PolicyOutcome outcome = 2;
}

message RescheduleAppointmentRequest {
  string appointment_id = 1;
  string resource_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  VisitType visit_type = 4;
  string reason = 5;
  bool override = 6;
}

message RescheduleAppointmentResponse {
  Appointment appointment = 1;
  // The booking this replaced. Cancelled rather than edited, because
  // SRS-SCH-005 requires the original to retain its status history.
  string previous_appointment_id = 2;
  PolicyOutcome outcome = 3;
}

message SchedulingPolicy {
  int32 notice_hours = 1;
  // Usually shorter than cancellation notice: moving an appointment leaves the
  // clinic able to refill the slot, while cancelling on the day does not.
  int32 reschedule_notice_hours = 2;
  // 0 means unlimited. A booking moved eleven times is a patient who is not
  // coming, and each move cost a slot somebody else could have used.
  int32 max_reschedules = 3;
  bool chargeable_when_late = 4;
  // Off by default: a facility that has not thought about remote consultations
  // has not decided which of its clinics can safely run that way.
  bool teleconsult_enabled = 5;
  // Empty means every visit type the roster offers remotely.
  repeated VisitType teleconsult_visit_types = 6;
  bool teleconsult_requires_confirmed_identity = 7;
  // Which messages this facility sends (SRS-SCH-012). Empty means none, which
  // is a real configuration: a clinic whose patients have no phones sends
  // nothing rather than accumulating failures.
  repeated NotificationKind notification_kinds = 8;
  // When a reminder goes out. Zero disables reminders even where the kind is
  // enabled, because "remind them at the appointment time" is not a reminder.
  int32 reminder_hours_before = 9;
}

message SetSchedulingPolicyRequest {
  // Empty applies tenant-wide; naming a facility overrides.
  string facility_id = 1;
  SchedulingPolicy policy = 2;
}

message SetSchedulingPolicyResponse {}

message BookSeriesRequest {
  string patient_id = 1;
  string resource_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  VisitType visit_type = 4;
  // Seven for a weekly course, which is most of them.
  int32 interval_days = 5;
  int32 occurrences = 6;
  string reason = 7;
}

message BookSeriesResponse {
  string series_id = 1;
  repeated Appointment appointments = 2;
  // The occurrences whose slot was gone. Reported rather than refused: a
  // twelve-week course where week seven is full is eleven appointments the
  // patient should keep.
  repeated google.protobuf.Timestamp unavailable = 3;
}

message CancelSeriesRequest {
  string series_id = 1;
  // The occurrence a future-occurrences change pivots on. Empty with
  // FUTURE_OCCURRENCES means every remaining occurrence.
  string from_appointment_id = 2;
  SeriesScope scope = 3;
  string reason = 4;
}

message CancelSeriesResponse {
  repeated string cancelled_appointment_ids = 1;
}

message WaitlistEntry {
  string waitlist_id = 1;
  string patient_id = 2;
  string resource_id = 3;
  string facility_id = 4;
  string org_unit_id = 5;
  VisitType visit_type = 6;
  // A patient who cannot come before Thursday should not be offered Wednesday.
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
  // The booking this patient already holds, if any. An earlier slot accepted
  // becomes a reschedule of it rather than a second booking.
  string appointment_id = 9;
  WaitlistStatus status = 10;
  google.protobuf.Timestamp offered_slot_at = 11;
  // A slot promised to somebody who has stopped reading their messages is
  // capacity nobody can use, so the offer expires.
  google.protobuf.Timestamp offer_expires_at = 12;
}

message JoinWaitlistRequest {
  string patient_id = 1;
  string resource_id = 2;
  string facility_id = 3;
  string org_unit_id = 4;
  VisitType visit_type = 5;
  google.protobuf.Timestamp not_before = 6;
  google.protobuf.Timestamp not_after = 7;
  string appointment_id = 8;
}

message JoinWaitlistResponse {
  WaitlistEntry entry = 1;
}

message OfferWaitlistSlotRequest {
  string waitlist_id = 1;
  string resource_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  VisitType visit_type = 4;
  // How long the offer stands. Zero takes the default.
  int32 valid_for_minutes = 5;
}

message OfferWaitlistSlotResponse {
  WaitlistEntry entry = 1;
}

message AcceptWaitlistOfferRequest {
  string waitlist_id = 1;
}

message AcceptWaitlistOfferResponse {
  WaitlistEntry entry = 1;
  Appointment appointment = 2;
  // The appointment the patient gave up, if any. Cancelled rather than left
  // standing: two confirmed bookings is exactly what SRS-SCH-006 forbids.
  string replaced_appointment_id = 3;
}

message DeclineWaitlistOfferRequest {
  string waitlist_id = 1;
}

message DeclineWaitlistOfferResponse {
  WaitlistEntry entry = 1;
}

message ListWaitlistRequest {
  string resource_id = 1;
  int32 page_size = 2;
}

message ListWaitlistResponse {
  repeated WaitlistEntry entries = 1;
}

message ExpireWaitlistOffersRequest {}

message ExpireWaitlistOffersResponse {
  int64 expired = 1;
}

message CheckInRequest {
  string appointment_id = 1;
  // What the patient will be called by. Left empty the server issues the next
  // queue number for the facility today, which is what most desks want; a
  // clinic running its own numbering scheme supplies its own.
  string token = 2;
  ArrivalMode arrival_mode = 3;
  // Unspecified means standard.
  Priority priority = 4;
  // Required whenever the priority is not standard: a walk-in put straight to
  // the front without one is indistinguishable from queue-jumping.
  string priority_reason = 5;
}

message CheckInResponse {
  Appointment appointment = 1;
}

message AdvanceAppointmentRequest {
  string appointment_id = 1;
  AppointmentStatus to = 2;
  // Required for cancellation and no-show, which can cost the patient money,
  // and for every correction.
  string reason = 3;
  // A transition the machine would otherwise refuse, under the "unless
  // authorized correction" clause of SRS-SCH-008. Needs its own permission.
  bool correction = 4;
}

message AdvanceAppointmentResponse {
  Appointment appointment = 1;
}

message ReprioritiseRequest {
  string appointment_id = 1;
  Priority priority = 2;
  // Mandatory, and shown to queue users rather than buried in an audit table
  // (SRS-SCH-011).
  string reason = 3;
}

message ReprioritiseResponse {
  Appointment appointment = 1;
}

// One patient's place in a queue.
message QueuePosition {
  Appointment appointment = 1;
  // From 1, in the order patients will actually be called.
  int32 position = 2;
  // How long this patient is likely to wait, in seconds. An estimate, and
  // labelled as one everywhere it appears (SRS-SCH-009).
  int64 estimated_wait_seconds = 3;
}

// The arithmetic behind a waiting time (SRS-SCH-009).
//
// Returned alongside the queue so a display can say *why* — "about forty
// minutes, based on four patients ahead and ten minutes each" is something a
// person can judge; "about forty minutes" is something they can only believe or
// disbelieve.
message QueueEstimate {
  // The observed average this session, falling back to the rostered slot length
  // when too little has happened to observe anything.
  double service_minutes = 1;
  // True when the service rate came from consultations actually completed
  // today, rather than from the roster. A display should be more tentative
  // about the second.
  bool observed = 2;
  // Two clinicians running a list halve the wait, and an estimate that ignored
  // them would be wrong by a factor of two on exactly the busiest days.
  int32 active_clinicians = 3;
}

message GetQueueRequest {
  string facility_id = 1;
  // Narrows to one clinician's queue. Empty means the facility's.
  string resource_id = 2;
  // Empty defaults to the current day in UTC, which is the queue a board shows.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp until = 4;
  int32 page_size = 5;
}

message GetQueueResponse {
  repeated QueuePosition positions = 1;
  QueueEstimate estimate = 2;
}

message RegisterWalkInRequest {
  string patient_id = 1;
  // The clinician or room they will be seen by. Optional: a busy department
  // triages first and allocates afterwards.
  string resource_id = 2;
  // Required when no resource is named.
  string facility_id = 3;
  string org_unit_id = 4;
  string token = 5;
  // Defaults to walk-in, and worth stating when it is not.
  ArrivalMode arrival_mode = 6;
  Priority priority = 7;
  string priority_reason = 8;
  // Why they are here. Required: it is the first thing whoever triages the
  // queue needs (SRS-SCH-010).
  string reason = 9;
}

message RegisterWalkInResponse {
  Appointment appointment = 1;
}

// One message about one appointment or one waiting-list offer (SRS-SCH-012).
message Notification {
  string notification_id = 1;
  // One of the two is set. A waitlist offer is about an offer rather than about
  // a booking: there is no appointment yet.
  string appointment_id = 2;
  string waitlist_id = 3;
  string patient_id = 4;
  NotificationKind kind = 5;
  // How it was sent — "sms", "email". A string rather than an enum because the
  // set is the notification service's to know.
  string channel = 6;
  DeliveryOutcome outcome = 7;
  // Explains a failure or a suppression in a sentence somebody at a desk can
  // act on.
  string detail = 8;
  // When the message becomes due. Set for a reminder; unset for anything that
  // goes immediately.
  google.protobuf.Timestamp send_after = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message RecordDeliveryOutcomeRequest {
  string notification_id = 1;
  DeliveryOutcome outcome = 2;
  // Required for a failure or a suppression: "failed" alone tells a desk
  // nothing they can act on.
  string detail = 3;
}

message RecordDeliveryOutcomeResponse {
  Notification notification = 1;
}

message ListNotificationsRequest {
  // Either names one subject. Both empty returns the queue of messages still
  // waiting to go out.
  string appointment_id = 1;
  string waitlist_id = 2;
  int32 page_size = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

service AppointmentService {
  // SRS-SCH-001. Rosters are configuration: defining when a clinic runs is
  // deliberately not bundled with looking inside the diary at who is coming.
  rpc DefineResource(DefineResourceRequest) returns (DefineResourceResponse);
  rpc SetResourceStatus(SetResourceStatusRequest) returns (SetResourceStatusResponse);
  rpc DefineSchedule(DefineScheduleRequest) returns (DefineScheduleResponse);

  // SRS-SCH-002. Blocked capacity cannot be booked without the override
  // permission, and leave cannot be overridden at all.
  rpc BlockPeriod(BlockPeriodRequest) returns (BlockPeriodResponse);
  rpc UnblockPeriod(UnblockPeriodRequest) returns (UnblockPeriodResponse);

  // SRS-SCH-003. Only bookable capacity is returned, generated from the roster
  // as it is now rather than from a cache that goes stale the moment it changes.
  rpc SearchSlots(SearchSlotsRequest) returns (SearchSlotsResponse);

  // SRS-SCH-004. Atomic, and incapable of exceeding configured capacity under
  // concurrency.
  rpc BookAppointment(BookAppointmentRequest) returns (BookAppointmentResponse);

  // SRS-SCH-005. Reschedule and cancel under a policy-driven cutoff. The
  // original retains its status history: a patient disputing an attendance
  // record needs to see that the 9th was moved rather than that it silently
  // became the 16th.
  rpc CancelAppointment(CancelAppointmentRequest) returns (CancelAppointmentResponse);
  rpc RescheduleAppointment(RescheduleAppointmentRequest) returns (RescheduleAppointmentResponse);
  rpc SetSchedulingPolicy(SetSchedulingPolicyRequest) returns (SetSchedulingPolicyResponse);

  // SRS-SCH-013. A change affects one occurrence or every future one, and never
  // a past one.
  rpc BookSeries(BookSeriesRequest) returns (BookSeriesResponse);
  rpc CancelSeries(CancelSeriesRequest) returns (CancelSeriesResponse);

  // SRS-SCH-006. An offer holds a slot for a stated period and then stops. It
  // never consumes the slot: capacity held for somebody who has stopped
  // reading their messages is capacity nobody can use and nobody can see is
  // gone.
  rpc JoinWaitlist(JoinWaitlistRequest) returns (JoinWaitlistResponse);
  rpc OfferWaitlistSlot(OfferWaitlistSlotRequest) returns (OfferWaitlistSlotResponse);
  rpc AcceptWaitlistOffer(AcceptWaitlistOfferRequest) returns (AcceptWaitlistOfferResponse);
  rpc DeclineWaitlistOffer(DeclineWaitlistOfferRequest) returns (DeclineWaitlistOfferResponse);
  rpc ListWaitlist(ListWaitlistRequest) returns (ListWaitlistResponse);
  rpc ExpireWaitlistOffers(ExpireWaitlistOffersRequest) returns (ExpireWaitlistOffersResponse);

  // SRS-SCH-007. Arrival with a token and an arrival mode. The token is the
  // clinic's own where it has a scheme, and the next queue number otherwise.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);

  // SRS-SCH-008. The queue states, with invalid transitions refused unless the
  // caller holds the correction permission and states a reason.
  rpc AdvanceAppointment(AdvanceAppointmentRequest) returns (AdvanceAppointmentResponse);

  // SRS-SCH-009. Who is waiting, in the order they will be called, with an
  // estimated wait for each. The estimate never changes the order.
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);

  // SRS-SCH-010. An unscheduled arrival becomes an ordinary appointment, so
  // every downstream context sees it without knowing about a second kind of
  // record.
  rpc RegisterWalkIn(RegisterWalkInRequest) returns (RegisterWalkInResponse);

  // SRS-SCH-011. A move in the queue, with a mandatory reason shown to queue
  // users rather than buried in an audit table.
  rpc Reprioritise(ReprioritiseRequest) returns (ReprioritiseResponse);

  // SRS-SCH-012. Scheduling sends nothing; it records that a message is owed
  // and what came back. A hospital that sends reminders and does not know which
  // arrived cannot tell a patient who says they were never told from one who
  // was.
  rpc RecordDeliveryOutcome(RecordDeliveryOutcomeRequest) returns (RecordDeliveryOutcomeResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  rpc GetAppointment(GetAppointmentRequest) returns (GetAppointmentResponse);
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
}
