message ListRegistryMembershipsRequest {
  string patient_id = 1;
  string registry_id = 2;
  bool current_only = 3;
  int32 page_size = 4;
}

message ListRegistryMembershipsResponse {
  repeated RegistryMembership memberships = 1;
}

service ClinicalService {
  // SRS-CLN-002, SRS-CLN-008, SRS-CLN-009, SRS-CLN-015, SRS-CLN-016. A signed
  // note is never edited: it is amended or extended by an addendum, each a new
  // document that points back.
  rpc WriteNote(WriteNoteRequest) returns (WriteNoteResponse);
  rpc SignNote(SignNoteRequest) returns (SignNoteResponse);
  rpc AmendNote(AmendNoteRequest) returns (AmendNoteResponse);
  rpc RetractNote(RetractNoteRequest) returns (RetractNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);

  rpc DefineTemplate(DefineTemplateRequest) returns (DefineTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc RetireTemplate(RetireTemplateRequest) returns (RetireTemplateResponse);

  // SRS-CLN-015. Expansions are stored into the note, so what is signed is
  // what a reader sees.
  rpc DefineSmartPhrase(DefineSmartPhraseRequest) returns (DefineSmartPhraseResponse);
  rpc ListSmartPhrases(ListSmartPhrasesRequest) returns (ListSmartPhrasesResponse);

  // SRS-CLN-003. A resolved problem stays on the list as historical.
  rpc RecordProblem(RecordProblemRequest) returns (RecordProblemResponse);
  rpc UpdateProblem(UpdateProblemRequest) returns (UpdateProblemResponse);
  rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse);

  // SRS-CLN-004. Coded, so medication decision support can check a
  // prescription against it immediately after commit.
  rpc RecordAllergy(RecordAllergyRequest) returns (RecordAllergyResponse);
  rpc VerifyAllergy(VerifyAllergyRequest) returns (VerifyAllergyResponse);
  rpc ListAllergies(ListAllergiesRequest) returns (ListAllergiesResponse);

  // SRS-CLN-005, SRS-CLN-010, SRS-CLN-011. Criticality is supplied by the
  // authoritative diagnostic service and never inferred here.
  rpc RecordObservation(RecordObservationRequest) returns (RecordObservationResponse);
  rpc ListObservations(ListObservationsRequest) returns (ListObservationsResponse);

  // SRS-CLN-012. Unacknowledged critical results escalate according to policy.
  rpc ListCriticalResults(ListCriticalResultsRequest) returns (ListCriticalResultsResponse);
  rpc AcknowledgeCriticalResult(AcknowledgeCriticalResultRequest)
      returns (AcknowledgeCriticalResultResponse);

  // SRS-CLN-006. Laterality is stated rather than assumed, and complications
  // are coded so they can be counted.
  rpc RecordProcedure(RecordProcedureRequest) returns (RecordProcedureResponse);
  rpc ListProcedures(ListProceduresRequest) returns (ListProceduresResponse);

  // SRS-CLN-007. Activities carry the task id that executes them.
  rpc CreateCarePlan(CreateCarePlanRequest) returns (CreateCarePlanResponse);
  rpc UpdateCarePlan(UpdateCarePlanRequest) returns (UpdateCarePlanResponse);
  rpc ListCarePlans(ListCarePlansRequest) returns (ListCarePlansResponse);

  // SRS-CLN-001. Assembled server-side, because a banner that differs between
  // screens is worse than none.
  rpc GetBanner(GetBannerRequest) returns (GetBannerResponse);

  // SRS-CLN-013. Clinical consent, deliberately not the privacy consent of
  // SRS-EMPI-013.
  rpc RecordConsent(RecordConsentRequest) returns (RecordConsentResponse);
  rpc WithdrawConsent(WithdrawConsentRequest) returns (WithdrawConsentResponse);
  rpc ListConsents(ListConsentsRequest) returns (ListConsentsResponse);

  // SRS-CLN-010, SRS-CLN-014. Access follows the parent record and the
  // attachment's own classification.
  rpc AttachFile(AttachFileRequest) returns (AttachFileResponse);
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
  rpc GetProvenance(GetProvenanceRequest) returns (GetProvenanceResponse);

  // SRS-CLN-020. Recalculation with a new formula never overwrites a
  // historical result.
  rpc StoreCalculation(StoreCalculationRequest) returns (StoreCalculationResponse);
  rpc ListCalculations(ListCalculationsRequest) returns (ListCalculationsResponse);

  // SRS-CLN-021. Alerts identify the triggering rule and version; overrides are
  // stored and reportable.
  rpc RaiseAlert(RaiseAlertRequest) returns (RaiseAlertResponse);
  rpc RespondToAlert(RespondToAlertRequest) returns (RespondToAlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);

  // SRS-CLN-022. The response closes the loop and stays linked to the request.
  rpc RequestConsult(RequestConsultRequest) returns (RequestConsultResponse);
  rpc RespondToConsult(RespondToConsultRequest) returns (RespondToConsultResponse);
  rpc ListConsults(ListConsultsRequest) returns (ListConsultsResponse);

  // SRS-CLN-023. Membership points at canonical clinical facts rather than
  // copying the chart.
  rpc EnrolInRegistry(EnrolInRegistryRequest) returns (EnrolInRegistryResponse);
  rpc ExitRegistry(ExitRegistryRequest) returns (ExitRegistryResponse);
  rpc ListRegistryMemberships(ListRegistryMembershipsRequest)
      returns (ListRegistryMembershipsResponse);
}
