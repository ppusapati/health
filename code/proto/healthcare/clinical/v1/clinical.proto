  Coding body_site = 7;
  Laterality laterality = 8;
  string outcome = 9;
  repeated Coding complications = 10;
  repeated string order_ids = 11;
  repeated string device_ids = 12;
  repeated string specimen_ids = 13;
  google.protobuf.Timestamp performed_start = 14;
  google.protobuf.Timestamp performed_end = 15;
  string note = 16;
  // Checks that the patient consented to this procedure before recording it
  // (SRS-CLN-013).
  bool require_consent = 17;
  PatientContext context = 18;
}

message RecordProcedureResponse {
  Procedure procedure = 1;
}

message ListProceduresRequest {
  string patient_id = 1;
  string encounter_id = 2;
  int32 page_size = 3;
}

message ListProceduresResponse {
