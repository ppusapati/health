  string encounter_id = 2;
  string rule_id = 3;
  string rule_version = 4;
  AlertLevel level = 5;
  string message = 6;
  string context_type = 7;
  string context_id = 8;
}

message RaiseAlertResponse {
  CDSAlert alert = 1;
}

message RespondToAlertRequest {
  string alert_id = 1;
  AlertOutcome outcome = 2;
  string override_code = 3;
  string override_reason = 4;
