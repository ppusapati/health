}

message RecordConsentRequest {
  string patient_id = 1;
  string encounter_id = 2;
  ConsentKind kind = 3;
  Coding procedure_code = 4;
  ConsentStatus status = 5;
  ConsentGiver given_by = 6;
  string given_by_name = 7;
  string document_id = 8;
  string witness_id = 9;
  google.protobuf.Timestamp valid_from = 10;
  google.protobuf.Timestamp valid_until = 11;
  string note = 12;
}

message RecordConsentResponse {
  ClinicalConsent consent = 1;
}

message WithdrawConsentRequest {
  string consent_id = 1;
}

message WithdrawConsentResponse {}

message ListConsentsRequest {
  string patient_id = 1;
  ConsentKind kind = 2;
  int32 page_size = 3;
}

message ListConsentsResponse {
  repeated ClinicalConsent consents = 1;
}

message AttachFileRequest {
  string parent_type = 1;
  string parent_id = 2;
  string patient_id = 3;
  AttachmentKind kind = 4;
  string content_type = 5;
  // The bytes live in object storage; this records what they are.
  string storage_key = 6;
  int64 size_bytes = 7;
  string digest = 8;
  string description = 9;
  Confidentiality confidentiality = 10;
  google.protobuf.Timestamp captured_at = 11;
  string source_system = 12;
  Provenance provenance = 13;
}

message AttachFileResponse {
  Attachment attachment = 1;
}

message ListAttachmentsRequest {
  string parent_type = 1;
  string parent_id = 2;
  int32 page_size = 3;
}

message ListAttachmentsResponse {
  repeated Attachment attachments = 1;
}

message GetProvenanceRequest {
  string record_type = 1;
  string record_id = 2;
}

message GetProvenanceResponse {
  repeated Provenance provenance = 1;
}

message StoreCalculationRequest {
  string patient_id = 1;
  string encounter_id = 2;
  string calculator_id = 3;
  string formula_version = 4;
  string name = 5;
  repeated CalculatorInput inputs = 6;
  double value = 7;
  string unit = 8;
  string interpretation = 9;
  // Names an earlier result this rerun replaces. The earlier one stays.
  string supersedes_id = 10;
}

message StoreCalculationResponse {
  CalculatorResult result = 1;
}

message ListCalculationsRequest {
  string patient_id = 1;
  string calculator_id = 2;
  int32 page_size = 3;
}

message ListCalculationsResponse {
  // Superseded results included: the superseded one is the number a decision
  // was made from, and hiding it would make the decision inexplicable.
  repeated CalculatorResult results = 1;
}

message RaiseAlertRequest {
