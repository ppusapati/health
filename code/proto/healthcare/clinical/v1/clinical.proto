  // Picks the consult up without answering it yet.
  bool accept = 2;
  string response = 3;
  string response_document_id = 4;
  string decline_reason = 5;
}

message RespondToConsultResponse {
  Consult consult = 1;
}

message ListConsultsRequest {
  string patient_id = 1;
  string specialty = 2;
  bool open_only = 3;
  int32 page_size = 4;
}

message ListConsultsResponse {
