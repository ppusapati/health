// The clinical record: notes, problems, allergies, observations, procedures,
// plans, consents, decision support and consults.
//
// Owning context : clinical  (Master Engineering Registry)
// Owning service : ClinicalService
// Trace          : SRS-CLN-001 … SRS-CLN-024
//
// The rule this contract is built around is SRS-CLN-008's: signed content
// cannot be edited in place. There is no UpdateNote for a signed document —
// only Amend and Addendum, each producing a new document that points back.
syntax = "proto3";

package healthcare.clinical.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ppusapati/health/code/gen/go/healthcare/clinical/v1;clinicalv1";

// A coded concept from a terminology.
//
// System and code together, never code alone: "C50" means breast cancer in
// ICD-10 and something else in a local scheme.
message Coding {
  string system = 1;
  // Pins the release. Codes have been reassigned between revisions, so a code
  // with no version is ambiguous once a decade.
  string version = 2;
  string code = 3;
  // A bare code on a screen is a screen clinicians stop reading.
  string display = 4;
}

// How tightly a clinical record is held (SRS-CLN-019).
enum Confidentiality {
  CONFIDENTIALITY_UNSPECIFIED = 0;
  CONFIDENTIALITY_NORMAL = 1;
  // Needs a narrower role and purpose. Mental health, sexual health,
  // safeguarding.
  CONFIDENTIALITY_RESTRICTED = 2;
  // Visible only to the authoring team unless an emergency is declared.
  CONFIDENTIALITY_VERY_RESTRICTED = 3;
}

// Where a clinical document sits in its life (SRS-CLN-008).
enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  // Being written. Editable in place, and not visible to the whole hospital: a
  // half-written note read as fact is worse than no note.
  DOCUMENT_STATUS_DRAFT = 1;
  // Final and immutable. Everything after this is a new document that points
  // back.
  DOCUMENT_STATUS_SIGNED = 2;
  DOCUMENT_STATUS_AMENDED = 3;
  // Adds to a signed document without contradicting it — the result that came
  // back after the patient went home.
  DOCUMENT_STATUS_ADDENDUM = 4;
  // Retained rather than deleted: somebody may have read and acted on it.
  DOCUMENT_STATUS_ENTERED_IN_ERROR = 5;
}

enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  DOCUMENT_KIND_PROGRESS_NOTE = 1;
  DOCUMENT_KIND_CONSULTATION_NOTE = 2;
  DOCUMENT_KIND_DISCHARGE_SUMMARY = 3;
  DOCUMENT_KIND_OPERATION_NOTE = 4;
  DOCUMENT_KIND_NURSING_NOTE = 5;
  DOCUMENT_KIND_REFERRAL_LETTER = 6;
  DOCUMENT_KIND_PROCEDURE_REPORT = 7;
}

// What signing asserts (SRS-CLN-009).
//
// "I wrote this" and "I supervised whoever wrote this" are different claims
// with different consequences.
enum SignatureMeaning {
  SIGNATURE_MEANING_UNSPECIFIED = 0;
  SIGNATURE_MEANING_AUTHOR = 1;
  SIGNATURE_MEANING_VERIFIER = 2;
  // A supervising consultant asserting responsibility rather than agreement
  // with every word.
  SIGNATURE_MEANING_COSIGNER = 3;
  SIGNATURE_MEANING_WITNESS = 4;
  // Typed what somebody else dictated, and is not asserting the clinical
  // content at all (SRS-CLN-016). Does not finalise the note.
  SIGNATURE_MEANING_TRANSCRIBER = 5;
}

enum ProblemStatus {
  PROBLEM_STATUS_UNSPECIFIED = 0;
  PROBLEM_STATUS_ACTIVE = 1;
  // Neither active nor resolved: a cancer in remission is not a cancer that
  // has gone.
  PROBLEM_STATUS_REMISSION = 2;
  // Kept on the list as historical: a problem list that forgot a resolved
  // myocardial infarction would hide the most important fact about the patient.
  PROBLEM_STATUS_RESOLVED = 3;
  PROBLEM_STATUS_INACTIVE = 4;
  PROBLEM_STATUS_ENTERED_IN_ERROR = 5;
}

enum AllergyKind {
  ALLERGY_KIND_UNSPECIFIED = 0;
  ALLERGY_KIND_ALLERGY = 1;
  // Clinically different. Confusing them is how a patient with mild nausea on
  // codeine ends up unable to receive any opiate.
  ALLERGY_KIND_INTOLERANCE = 2;
}

enum AllergyCriticality {
  ALLERGY_CRITICALITY_UNSPECIFIED = 0;
  ALLERGY_CRITICALITY_LOW = 1;
  ALLERGY_CRITICALITY_HIGH = 2;
  // The honest answer when nobody knows, and not the same as low: defaulting
  // to low would tell a prescriber there is no danger when it means nobody has
  // looked.
  ALLERGY_CRITICALITY_UNABLE_TO_ASSESS = 3;
}

enum AllergyVerification {
  ALLERGY_VERIFICATION_UNSPECIFIED = 0;
  // What the patient said. Most allergy records are this, and it still warns.
  ALLERGY_VERIFICATION_UNCONFIRMED = 1;
  ALLERGY_VERIFICATION_CONFIRMED = 2;
  // Investigated and not true. Kept rather than deleted: the next clinician
  // needs to know the question was asked and settled.
  ALLERGY_VERIFICATION_REFUTED = 3;
  ALLERGY_VERIFICATION_ENTERED_IN_ERROR = 4;
}

// The authoritative service's reading of a value (SRS-CLN-011).
//
// Supplied, never derived here: the laboratory knows its reference ranges, its
// analyser and its population; a chart guessing from a number does not.
enum Interpretation {
  INTERPRETATION_UNSPECIFIED = 0;
  INTERPRETATION_NORMAL = 1;
  INTERPRETATION_HIGH = 2;
  INTERPRETATION_LOW = 3;
  INTERPRETATION_CRITICAL_HIGH = 4;
  INTERPRETATION_CRITICAL_LOW = 5;
  INTERPRETATION_ABNORMAL = 6;
  // "Nobody said" rather than "it is fine".
  INTERPRETATION_UNKNOWN = 7;
}

enum ObservationStatus {
  OBSERVATION_STATUS_UNSPECIFIED = 0;
  OBSERVATION_STATUS_REGISTERED = 1;
  // May still change. Reported because a preliminary blood culture at 2am
  // changes treatment.
  OBSERVATION_STATUS_PRELIMINARY = 2;
  OBSERVATION_STATUS_FINAL = 3;
  OBSERVATION_STATUS_AMENDED = 4;
  OBSERVATION_STATUS_CANCELLED = 5;
  OBSERVATION_STATUS_ENTERED_IN_ERROR = 6;
}

enum ProcedureStatus {
  PROCEDURE_STATUS_UNSPECIFIED = 0;
  PROCEDURE_STATUS_PLANNED = 1;
  PROCEDURE_STATUS_IN_PROGRESS = 2;
  PROCEDURE_STATUS_COMPLETED = 3;
  // Begun and abandoned. A laparotomy abandoned on opening is a very different
  // fact from one that was cancelled.
  PROCEDURE_STATUS_STOPPED = 4;
  PROCEDURE_STATUS_NOT_DONE = 5;
  PROCEDURE_STATUS_ENTERED_IN_ERROR = 6;
}

// Which side a procedure was performed on (SRS-CLN-006).
//
// Its own field rather than free text: wrong-side surgery is a never-event, and
// the only defence a record offers is that the side was stated somewhere a
// checklist can read.
enum Laterality {
  LATERALITY_UNSPECIFIED = 0;
  LATERALITY_NOT_APPLICABLE = 1;
  LATERALITY_LEFT = 2;
  LATERALITY_RIGHT = 3;
  LATERALITY_BILATERAL = 4;
  // The honest answer when nobody recorded it, and not the same as not
  // applicable: an omission must not look like a decision.
  LATERALITY_UNRECORDED = 5;
}

enum CarePlanStatus {
  CARE_PLAN_STATUS_UNSPECIFIED = 0;
  CARE_PLAN_STATUS_DRAFT = 1;
  CARE_PLAN_STATUS_ACTIVE = 2;
  CARE_PLAN_STATUS_ON_HOLD = 3;
  CARE_PLAN_STATUS_COMPLETED = 4;
  CARE_PLAN_STATUS_REVOKED = 5;
}

enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  GOAL_STATUS_PROPOSED = 1;
  GOAL_STATUS_ACTIVE = 2;
  GOAL_STATUS_ACHIEVED = 3;
  GOAL_STATUS_NOT_ACHIEVED = 4;
  GOAL_STATUS_CANCELLED = 5;
}

enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVITY_STATUS_NOT_STARTED = 1;
  ACTIVITY_STATUS_SCHEDULED = 2;
  ACTIVITY_STATUS_IN_PROGRESS = 3;
  ACTIVITY_STATUS_COMPLETED = 4;
  ACTIVITY_STATUS_CANCELLED = 5;
}

enum AttachmentKind {
  ATTACHMENT_KIND_UNSPECIFIED = 0;
  ATTACHMENT_KIND_IMAGE = 1;
  ATTACHMENT_KIND_DOCUMENT = 2;
  ATTACHMENT_KIND_AUDIO = 3;
  ATTACHMENT_KIND_VIDEO = 4;
  ATTACHMENT_KIND_WAVEFORM = 5;
}

// What a clinical consent covers (SRS-CLN-013).
//
// Deliberately not the privacy consent of SRS-EMPI-013: conflating them
// produces a system where withdrawing a marketing preference cancels an
// operation.
enum ConsentKind {
  CONSENT_KIND_UNSPECIFIED = 0;
  CONSENT_KIND_PROCEDURE = 1;
  CONSENT_KIND_ANAESTHESIA = 2;
  CONSENT_KIND_TRANSFUSION = 3;
  CONSENT_KIND_PHOTOGRAPHY = 4;
  CONSENT_KIND_RESEARCH = 5;
  CONSENT_KIND_TREATMENT = 6;
}

enum ConsentStatus {
  CONSENT_STATUS_UNSPECIFIED = 0;
  CONSENT_STATUS_GIVEN = 1;
  // A recorded refusal, which is not the same as an absent consent.
  CONSENT_STATUS_REFUSED = 2;
  CONSENT_STATUS_WITHDRAWN = 3;
  CONSENT_STATUS_EXPIRED = 4;
}

// Who gave the consent (SRS-CLN-013).
//
// A consent given by a parent for a child is a different fact from one the
// patient gave, and the difference is what a court asks about.
enum ConsentGiver {
  CONSENT_GIVER_UNSPECIFIED = 0;
  CONSENT_GIVER_PATIENT = 1;
  CONSENT_GIVER_PARENT = 2;
  CONSENT_GIVER_LEGAL_GUARDIAN = 3;
  CONSENT_GIVER_REPRESENTATIVE = 4;
}

// How urgent a decision-support alert is (SRS-CLN-021).
enum AlertLevel {
  ALERT_LEVEL_UNSPECIFIED = 0;
  // Stops the action until somebody overrides it. Reserved for the few rules
  // where proceeding is almost never right.
  ALERT_LEVEL_HARD = 1;
  // Warns and lets the clinician proceed. Most rules are this, because a
  // system where everything is a hard stop is one where clinicians learn to
  // dismiss hard stops.
  ALERT_LEVEL_SOFT = 2;
  ALERT_LEVEL_INFO = 3;
}

enum AlertOutcome {
  ALERT_OUTCOME_UNSPECIFIED = 0;
  ALERT_OUTCOME_PENDING = 1;
  // The clinician changed what they were doing — the outcome that justifies
  // the whole system.
  ALERT_OUTCOME_ACCEPTED = 2;
  ALERT_OUTCOME_OVERRIDDEN = 3;
  ALERT_OUTCOME_NOT_APPLICABLE = 4;
}

enum ConsultUrgency {
  CONSULT_URGENCY_UNSPECIFIED = 0;
  CONSULT_URGENCY_EMERGENCY = 1;
  CONSULT_URGENCY_URGENT = 2;
  CONSULT_URGENCY_ROUTINE = 3;
}

enum ConsultStatus {
  CONSULT_STATUS_UNSPECIFIED = 0;
  CONSULT_STATUS_REQUESTED = 1;
  // Picked up by the receiving service, which is what tells the requester
  // somebody has it.
  CONSULT_STATUS_ACCEPTED = 2;
  CONSULT_STATUS_ANSWERED = 3;
  // Recorded rather than deleted: a declined consult is the fact a requester
  // most needs.
  CONSULT_STATUS_DECLINED = 4;
  CONSULT_STATUS_CANCELLED = 5;
}

// The chart the caller believes they are working in (SRS-CLN-017).
//
// Carried on every action that changes a patient's record and checked against
// the record the action lands on. The failure it guards against is mundane and
// common: four charts open, the wrong tab in front, a prescription for the
// patient in the next bed.
message PatientContext {
  string patient_id = 1;
  string encounter_id = 2;
  // When the chart was opened. A screen left open overnight is a screen the
  // next clinician inherits with somebody else's patient in it.
  google.protobuf.Timestamp opened_at = 3;
}

message Section {
  string heading = 1;
  // The expanded content. Smart phrases are expanded before storage
  // (SRS-CLN-015), so what is signed is what a reader sees.
  string text = 2;
}

message Signature {
  string signature_id = 1;
  string subject_id = 2;
  SignatureMeaning meaning = 3;
  google.protobuf.Timestamp signed_at = 4;
  // Pins what was signed. Without it a signature says "this person signed
  // something called note 47", and the content of note 47 is exactly what a
  // dispute is about.
  string content_hash = 5;
  string template_version = 6;
}

message Document {
  string document_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  DocumentKind kind = 4;
  string template_id = 5;
  // The exact revision the note was composed against (SRS-CLN-002).
  string template_version = 6;
  string title = 7;
  repeated Section sections = 8;
  DocumentStatus status = 9;
  Confidentiality confidentiality = 10;
  // Exactly one, and only on an amendment or an addendum.
  string amends_id = 11;
  string adds_to_id = 12;
  string change_reason = 13;
  string retraction_reason = 14;
  // Content that arrived from speech recognition (SRS-CLN-016).
  bool dictated = 15;
  repeated Signature signatures = 16;
  string authored_by = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  int64 version = 20;
  // Whether the content still matches what was signed. A signature is only
  // evidence if the thing it pinned has not moved.
  bool intact = 21;
}

message Template {
  string template_id = 1;
  string name = 2;
  // Never mutated in place: editing a published template would silently rewrite
  // what every historical note claims to have answered.
  string version = 3;
  DocumentKind kind = 4;
  string specialty = 5;
  repeated string sections = 6;
  // A retired template can still be read on old notes but cannot be chosen for
  // a new one.
  bool retired = 7;
}

message Problem {
  string problem_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  Coding code = 4;
  string note = 5;
  ProblemStatus status = 6;
  google.protobuf.Timestamp onset_at = 7;
  google.protobuf.Timestamp resolved_at = 8;
  Confidentiality confidentiality = 9;
  string recorded_by = 10;
  google.protobuf.Timestamp recorded_at = 11;
  int64 version = 12;
}

message Reaction {
  Coding manifestation = 1;
  // How bad it was, which is not the same as criticality: a mild past reaction
  // to a drug can still carry a high criticality.
  string severity = 2;
  string note = 3;
}

message Allergy {
  string allergy_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  // Coded, because the acceptance criterion is that the allergy reaches
  // medication decision support, and free text cannot be checked.
  Coding substance = 4;
  AllergyKind kind = 5;
  AllergyCriticality criticality = 6;
  AllergyVerification verification = 7;
  repeated Reaction reactions = 8;
  google.protobuf.Timestamp onset_at = 9;
  string note = 10;
  string recorded_by = 11;
  google.protobuf.Timestamp recorded_at = 12;
  int64 version = 13;
}

message Quantity {
  double value = 1;
  // Unit and value are inseparable. A potassium of 6.1 is a crisis in mmol/L
  // and meaningless without it.
  string unit = 2;
}

message Observation {
  string observation_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  Coding code = 4;
  // Exactly one carries the result: a blood pressure is a quantity, a blood
  // group is a code, and a microbiology comment is text.
  Quantity value = 5;
  string text_value = 6;
  Coding coded_value = 7;
  // The range the source used, stored rather than looked up: applying today's
  // range to a five-year-old result would reinterpret history.
  double reference_low = 8;
  double reference_high = 9;
  bool has_reference_range = 10;
  string reference_text = 11;
  // Supplied by the authoritative service, never derived (SRS-CLN-011).
  Interpretation interpretation = 12;
  // Flag provenance. A chart showing "critical" with no source cannot answer
  // "who decided this".
  string interpretation_source = 13;
  ObservationStatus status = 14;
  // When the observation was true of the patient — when blood was drawn, not
  // when the analyser finished.
  google.protobuf.Timestamp effective_at = 15;
  google.protobuf.Timestamp issued_at = 16;
  string performer_id = 17;
  string device_id = 18;
  // Empty for something recorded here; set for anything imported
  // (SRS-CLN-010).
  string source_system = 19;
  string note = 20;
  string amends_id = 21;
  string recorded_by = 22;
  google.protobuf.Timestamp recorded_at = 23;
}

message CriticalAcknowledgement {
  string acknowledgement_id = 1;
  string observation_id = 2;
  string patient_id = 3;
  string acknowledged_by = 4;
  google.protobuf.Timestamp acknowledged_at = 5;
  // What the clinician did. Mandatory: "seen" is not a clinical response to a
  // potassium of 6.9.
  string action = 6;
  google.protobuf.Timestamp notified_at = 7;
  // The gap between notification and acknowledgement, which is the number a
  // safety review wants.
  int64 delay_seconds = 8;
}

message Performer {
  string subject_id = 1;
  string role = 2;
}

message Procedure {
  string procedure_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  Coding code = 4;
  ProcedureStatus status = 5;
  Coding indication = 6;
  repeated Performer performers = 7;
  Coding body_site = 8;
  Laterality laterality = 9;
  string outcome = 10;
  // Coded so they can be counted. A complication in free text is a
  // complication that never reaches a quality report.
  repeated Coding complications = 11;
  // References rather than copies: a copied implant record is the one that
  // stays wrong after a recall.
  repeated string order_ids = 12;
  repeated string device_ids = 13;
  repeated string specimen_ids = 14;
  google.protobuf.Timestamp performed_start = 15;
  google.protobuf.Timestamp performed_end = 16;
  string note = 17;
  string recorded_by = 18;
  google.protobuf.Timestamp recorded_at = 19;
}

message Goal {
  string goal_id = 1;
  string description = 2;
  GoalStatus status = 3;
  google.protobuf.Timestamp target_date = 4;
  google.protobuf.Timestamp achieved_at = 5;
}

message Activity {
  string activity_id = 1;
  string description = 2;
  // A plan whose activities have no owner is a list of things everybody
  // assumes somebody else is doing.
  string owner_id = 3;
  ActivityStatus status = 4;
  google.protobuf.Timestamp scheduled_for = 5;
  // Links to the task that carries it out, so the worklist and the plan do not
  // drift (SRS-NUR-002).
  string task_id = 6;
}

message CarePlan {
  string care_plan_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  string title = 4;
  CarePlanStatus status = 5;
  // References rather than copies: a plan holding its own copy of a diagnosis
  // is the copy that stays wrong after the diagnosis changes.
  repeated string problem_ids = 6;
  repeated Goal goals = 7;
  repeated Activity activities = 8;
  string owner_id = 9;
  google.protobuf.Timestamp starts_at = 10;
  google.protobuf.Timestamp ends_at = 11;
  int64 version = 12;
}

// Where an imported record came from (SRS-CLN-010).
message Provenance {
  string provenance_id = 1;
  string record_type = 2;
  string record_id = 3;
  // Without the organisation this says "it came from outside", which tells a
  // clinician nothing they can weigh.
  string source_organization = 4;
  string source_system = 5;
  string source_record_id = 6;
  // When it arrived here, distinct from when it was true of the patient.
  google.protobuf.Timestamp ingested_at = 7;
  google.protobuf.Timestamp authored_at = 8;
  string authored_by = 9;
  string assertion = 10;
}

message Attachment {
  string attachment_id = 1;
  string parent_type = 2;
  string parent_id = 3;
  string patient_id = 4;
  AttachmentKind kind = 5;
  string content_type = 6;
  // Opaque: a key that encoded the patient would leak in every log line.
  string storage_key = 7;
  int64 size_bytes = 8;
  string digest = 9;
  string description = 10;
  // The attachment's own class, which may be tighter than its parent's.
  Confidentiality confidentiality = 11;
  // When the image or recording was made, which is not when it was uploaded.
  google.protobuf.Timestamp captured_at = 12;
  string source_system = 13;
  string uploaded_by = 14;
  google.protobuf.Timestamp uploaded_at = 15;
}

message ClinicalConsent {
  string consent_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  ConsentKind kind = 4;
  // A consent for "a procedure" is not a consent for any procedure.
  Coding procedure_code = 5;
  ConsentStatus status = 6;
  ConsentGiver given_by = 7;
  string given_by_name = 8;
  string document_id = 9;
  string witness_id = 10;
  google.protobuf.Timestamp valid_from = 11;
  // A consent with no expiry for an operation two years later is a consent to
  // something the patient no longer remembers agreeing to.
  google.protobuf.Timestamp valid_until = 12;
  string note = 13;
  string recorded_by = 14;
}

message CalculatorInput {
  string name = 1;
  string value = 2;
  string unit = 3;
  // Which record the value came from. A score built from typed values is a
  // different thing from one built from measurements.
  string source_id = 4;
}

message CalculatorResult {
  string result_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  string calculator_id = 4;
  // An unversioned calculator makes every stored score ambiguous the first
  // time somebody corrects a coefficient.
  string formula_version = 5;
  string name = 6;
  // A score whose inputs were not kept cannot be checked, and the one time
  // anybody checks is when it looks wrong.
  repeated CalculatorInput inputs = 7;
  double value = 8;
  string unit = 9;
  string interpretation = 10;
  // A rerun with a newer formula chains forward; the original stays.
  string superseded_by_id = 11;
  string calculated_by = 12;
  google.protobuf.Timestamp calculated_at = 13;
}

message CDSAlert {
  string alert_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  string rule_id = 4;
  // An override report that could not say which version fired cannot tell a
  // tuning change from a behaviour change.
  string rule_version = 5;
  AlertLevel level = 6;
  // The wording is tuned too, and an override against a message nobody can
  // reproduce is an override nobody can interpret.
  string message = 7;
  string context_type = 8;
  string context_id = 9;
  AlertOutcome outcome = 10;
  // A chosen code is what makes overrides reportable rather than a pile of
  // free text.
  string override_code = 11;
  string override_reason = 12;
  google.protobuf.Timestamp fired_at = 13;
  string responded_by = 14;
  google.protobuf.Timestamp responded_at = 15;
}

message Consult {
  string consult_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  string specialty = 4;
  ConsultUrgency urgency = 5;
  string reason = 6;
  // A consult with background but no question produces an opinion that answers
  // something else.
  string question = 7;
  ConsultStatus status = 8;
  string responding_subject_id = 9;
  string response = 10;
  // The answer lands on the request rather than becoming a free-floating note.
  string response_document_id = 11;
  string decline_reason = 12;
  string requested_by = 13;
  google.protobuf.Timestamp requested_at = 14;
  google.protobuf.Timestamp responded_at = 15;
  int64 version = 16;
}

message RegistryMembership {
  string membership_id = 1;
  string patient_id = 2;
  string registry_id = 3;
  // The canonical facts membership rests on. At least one is required: a
  // membership resting on nothing cannot be re-derived or defended.
  string problem_id = 4;
  string diagnosis_id = 5;
  google.protobuf.Timestamp enrolled_at = 6;
  google.protobuf.Timestamp exited_at = 7;
  string exit_reason = 8;
  bool consented = 9;
}

message SmartPhrase {
  string phrase_id = 1;
  // Empty means shared across the tenant; otherwise it is one clinician's.
  string owner_id = 2;
  string shortcut = 3;
  string expansion = 4;
}

// One identifier a clinician can read out at the bedside (SRS-CLN-001).
message BannerIdentifier {
  string system = 1;
  string value = 2;
  string label = 3;
}

message BannerAlert {
  // "critical", "warning", "info".
  string severity = 1;
  string kind = 2;
  // Kept short: a banner is read in a second, and an alert that needs a
  // paragraph belongs in the chart.
  string text = 3;
  string record_id = 4;
}

// What every clinical screen shows about the patient in front of the clinician
// (SRS-CLN-001).
message Banner {
  string patient_id = 1;
  repeated BannerIdentifier identifiers = 2;
  string display_name = 3;
  // Rendered rather than a date: a screen showing "0" for a two-week-old is a
  // dosing error waiting to happen.
  string age_display = 4;
  string sex = 5;
  // Deliberately few. A banner with fifteen alerts is a banner nobody reads.
  repeated BannerAlert alerts = 6;
  // Which visit the screen is in — "Ward 4, inpatient, day 3".
  string encounter_context = 7;
  bool deceased = 8;
}

message WriteNoteRequest {
  // Revises an existing draft. Empty starts a new one.
  string document_id = 1;
  string patient_id = 2;
  string encounter_id = 3;
  DocumentKind kind = 4;
  string template_id = 5;
  string template_version = 6;
  string title = 7;
  repeated Section sections = 8;
  Confidentiality confidentiality = 9;
  bool dictated = 10;
  PatientContext context = 11;
}

message WriteNoteResponse {
  Document document = 1;
}

message SignNoteRequest {
  string document_id = 1;
  SignatureMeaning meaning = 2;
  PatientContext context = 3;
}

message SignNoteResponse {
  Document document = 1;
}

message AmendNoteRequest {
  string document_id = 1;
  string title = 2;
  repeated Section sections = 3;
  // Required for an amendment and absent for an addendum: an addendum does not
  // contradict anything, it adds what was not yet known.
  string reason = 4;
  bool addendum = 5;
  PatientContext context = 6;
}

message AmendNoteResponse {
  Document document = 1;
}

message RetractNoteRequest {
  string document_id = 1;
  string reason = 2;
}

message RetractNoteResponse {}

message GetNoteRequest {
  string document_id = 1;
}

message GetNoteResponse {
  Document document = 1;
}

message ListNotesRequest {
  string patient_id = 1;
  string encounter_id = 2;
  DocumentKind kind = 3;
  bool include_drafts = 4;
  int32 page_size = 5;
}

message ListNotesResponse {
  repeated Document documents = 1;
}

message DefineTemplateRequest {
  Template template = 1;
}

message DefineTemplateResponse {}

message ListTemplatesRequest {
  DocumentKind kind = 1;
  bool include_retired = 2;
  int32 page_size = 3;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
}

message RetireTemplateRequest {
  string template_id = 1;
  string version = 2;
}

message RetireTemplateResponse {}

message DefineSmartPhraseRequest {
  // Without its leading dot.
  string shortcut = 1;
  string expansion = 2;
  // A shared phrase changes what everybody's notes say, so it needs the
  // configuration permission.
  bool shared = 3;
}

message DefineSmartPhraseResponse {
  SmartPhrase phrase = 1;
}

message ListSmartPhrasesRequest {}

message ListSmartPhrasesResponse {
  repeated SmartPhrase phrases = 1;
}

message RecordProblemRequest {
  string patient_id = 1;
  string encounter_id = 2;
  Coding code = 3;
  string note = 4;
  ProblemStatus status = 5;
  google.protobuf.Timestamp onset_at = 6;
  Confidentiality confidentiality = 7;
  PatientContext context = 8;
}

message RecordProblemResponse {
  Problem problem = 1;
}

message UpdateProblemRequest {
  string problem_id = 1;
  ProblemStatus status = 2;
  google.protobuf.Timestamp resolved_at = 3;
}

message UpdateProblemResponse {
  Problem problem = 1;
}

message ListProblemsRequest {
  string patient_id = 1;
  bool active_only = 2;
  int32 page_size = 3;
}

message ListProblemsResponse {
  repeated Problem problems = 1;
}

message RecordAllergyRequest {
  string patient_id = 1;
  string encounter_id = 2;
  Coding substance = 3;
  AllergyKind kind = 4;
  AllergyCriticality criticality = 5;
  AllergyVerification verification = 6;
  repeated Reaction reactions = 7;
  google.protobuf.Timestamp onset_at = 8;
  string note = 9;
  PatientContext context = 10;
}

message RecordAllergyResponse {
  Allergy allergy = 1;
}

message VerifyAllergyRequest {
  string allergy_id = 1;
  AllergyVerification verification = 2;
}

message VerifyAllergyResponse {
  Allergy allergy = 1;
}

message ListAllergiesRequest {
  string patient_id = 1;
  bool active_only = 2;
  int32 page_size = 3;
}

message ListAllergiesResponse {
  repeated Allergy allergies = 1;
}

message RecordObservationRequest {
  string patient_id = 1;
  string encounter_id = 2;
  Coding code = 3;
  Quantity value = 4;
  string text_value = 5;
  Coding coded_value = 6;
  double reference_low = 7;
  double reference_high = 8;
  bool has_reference_range = 9;
  string reference_text = 10;
  // Supplied by the authoritative diagnostic service. The server never infers
  // it (SRS-CLN-011).
  Interpretation interpretation = 11;
  string interpretation_source = 12;
  ObservationStatus status = 13;
  google.protobuf.Timestamp effective_at = 14;
  google.protobuf.Timestamp issued_at = 15;
  string performer_id = 16;
  string device_id = 17;
  string source_system = 18;
  // Records where an imported result came from (SRS-CLN-010).
  Provenance provenance = 19;
  string note = 20;
  PatientContext context = 21;
}

message RecordObservationResponse {
  Observation observation = 1;
}

message ListObservationsRequest {
  string patient_id = 1;
  string encounter_id = 2;
  // Narrows to one measurement, which is what a trend asks for.
  string code = 3;
  int32 page_size = 4;
}

message ListObservationsResponse {
  repeated Observation observations = 1;
}

message CriticalResult {
  Observation observation = 1;
  // How many times this should have escalated by now (SRS-CLN-012). Computed
  // rather than stored, so a policy change takes effect on results already
  // outstanding.
  int32 due_escalations = 2;
}

message ListCriticalResultsRequest {
  int32 page_size = 1;
}

message ListCriticalResultsResponse {
  repeated CriticalResult results = 1;
}

message AcknowledgeCriticalResultRequest {
  string observation_id = 1;
  // Mandatory: "seen" is not a clinical response to a potassium of 6.9.
  string action = 2;
}

message AcknowledgeCriticalResultResponse {
  CriticalAcknowledgement acknowledgement = 1;
}

message RecordProcedureRequest {
  string patient_id = 1;
  string encounter_id = 2;
