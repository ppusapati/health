message UpdateCarePlanRequest {
  string care_plan_id = 1;
  CarePlanStatus status = 2;
  repeated Goal goals = 3;
  repeated Activity activities = 4;
  repeated string problem_ids = 5;
}

message UpdateCarePlanResponse {
  CarePlan care_plan = 1;
}

message ListCarePlansRequest {
  string patient_id = 1;
  bool active_only = 2;
  int32 page_size = 3;
}

message ListCarePlansResponse {
  repeated CarePlan care_plans = 1;
}

message GetBannerRequest {
