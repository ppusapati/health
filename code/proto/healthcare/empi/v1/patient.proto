// Enterprise master patient index: patient identity, identifiers, duplicates.
//
// Owning context : patient.identity  (Master Engineering Registry)
// Owning service : PatientService
// Trace          : SRS-EMPI-001, SRS-EMPI-002, SRS-EMPI-003, SRS-EMPI-004,
//                  SRS-EMPI-008
syntax = "proto3";

package healthcare.empi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ppusapati/health/code/gen/go/healthcare/empi/v1;empiv1";

// Patient identity lifecycle (Wave-1 spec §6).
enum PatientStatus {
  PATIENT_STATUS_UNSPECIFIED = 0;
  // Created before identity was confirmed — an unconscious admission, a portal
  // pre-registration. A real patient who can receive care; what is missing is
  // a confirmed identity.
  PATIENT_STATUS_CANDIDATE = 1;
  PATIENT_STATUS_ACTIVE = 2;
  // Lost a merge. Never deleted: clinical records written against it still
  // point here, and resolution to the survivor is what makes them readable.
  PATIENT_STATUS_MERGED = 3;
  PATIENT_STATUS_INACTIVE = 4;
}

// Administrative sex, recorded for identification and clinical safety.
//
// Deliberately not named Gender: this is the field a laboratory uses to pick a
// reference range. How a person identifies is a clinical observation with its
// own history and belongs to SRS-CLN.
enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_UNKNOWN = 1;
  SEX_FEMALE = 2;
  SEX_MALE = 3;
  SEX_OTHER = 4;
}

// How much of a date is actually known.
//
// "About forty years old" is what an emergency department has for an
// unconscious patient. Storing it as 1 January of the implied year would be a
// false precision that duplicate matching then treats as a strong signal, so
// the precision travels with the value.
enum DatePrecision {
  DATE_PRECISION_UNSPECIFIED = 0;
  DATE_PRECISION_DAY = 1;
  DATE_PRECISION_MONTH = 2;
  DATE_PRECISION_YEAR = 3;
  // Derived from a stated age. The weakest signal a matcher can be given.
  DATE_PRECISION_ESTIMATED = 4;
}

enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  // Medical record number, issued by a facility.
  IDENTIFIER_TYPE_MRN = 1;
  // National or regional health identifier — ABHA, NHS number.
  IDENTIFIER_TYPE_NATIONAL_HEALTH = 2;
  IDENTIFIER_TYPE_GOVERNMENT = 3;
  IDENTIFIER_TYPE_INSURANCE = 4;
  IDENTIFIER_TYPE_EXTERNAL = 5;
}

// How much an identifier is worth as identity evidence (SRS-EMPI-011).
//
// "A clerk typed this ABHA number" and "ABDM confirmed it belongs to this
// person" are the same value with very different weight, and SRS-EMPI-010
// relies on the difference when it requires a configured *positive* identifier.
enum IdentifierAssurance {
  IDENTIFIER_ASSURANCE_UNSPECIFIED = 0;
  // Stated by a person and typed in. What happens at a registration desk.
  IDENTIFIER_ASSURANCE_ASSERTED = 1;
  // Confirmed by the authority that issues it, at a recorded moment.
  IDENTIFIER_ASSURANCE_VERIFIED = 2;
}

enum IdentifierStatus {
  IDENTIFIER_STATUS_UNSPECIFIED = 0;
  IDENTIFIER_STATUS_ACTIVE = 1;
  // Was correct and has been replaced. Still resolves: a discharge summary
  // printed last week quotes it.
  IDENTIFIER_STATUS_SUPERSEDED = 2;
  // Was wrong. Must NOT resolve to this patient — it belongs to somebody else,
  // or to nobody. That single difference is why there are two states here
  // rather than one "inactive".
  IDENTIFIER_STATUS_REVOKED = 3;
}

// A date whose precision is recorded alongside it.
message PartialDate {
  // Date component; time of day is ignored.
  google.protobuf.Timestamp date = 1;
  DatePrecision precision = 2;
}

message HumanName {
  // Some cultures record no family name at all, so this is not universally
  // required — the facility's demographic policy decides.
  string family = 1;
  repeated string given = 2;
  string prefix = 3;
  string suffix = 4;
}

enum ContactSystem {
  CONTACT_SYSTEM_UNSPECIFIED = 0;
  CONTACT_SYSTEM_PHONE = 1;
  CONTACT_SYSTEM_EMAIL = 2;
}

message ContactPoint {
  ContactSystem system = 1;
  string value = 2;
  // Distinguishes a mobile the patient answers from a landline at an address
  // they left — which matters for contacting them and for matching.
  string use = 3;
}

message Address {
  repeated string lines = 1;
  string city = 2;
  string district = 3;
  string state = 4;
  string postal_code = 5;
  // ISO 3166-1 alpha-2.
  string country = 6;
}

message Demographics {
  HumanName name = 1;
  PartialDate birth_date = 2;
  Sex sex = 3;
  repeated ContactPoint phones = 4;
  repeated ContactPoint emails = 5;
  repeated Address addresses = 6;
}

// One way the outside world names this patient.
//
// None of these is the patient's key. SRS-EMPI-002 requires the internal
// identifier to stay separate precisely so that these can change.
message PatientIdentifier {
  string identifier_id = 1;
  IdentifierType type = 2;
  // Namespaces the value. Two facilities both issuing "MRN 1001" are two
  // different patients.
  string system = 3;
  string value = 4;
  string assigning_authority = 5;
  IdentifierStatus status = 6;
  // Where this system learned the value. SRS-EMPI-011 requires link history and
  // source to be retained.
  string source = 7;
  // The identifier a banner shows.
  bool primary = 8;
  google.protobuf.Timestamp linked_at = 9;
  google.protobuf.Timestamp unlinked_at = 10;
  // Explains a supersede or a revoke.
  string reason = 11;
  IdentifierAssurance assurance = 12;
  // When the issuing authority last confirmed the value. Unset while the
  // identifier is merely asserted.
  google.protobuf.Timestamp verified_at = 13;
}

// Where a proposed demographic change came from (SRS-EMPI-012, SRS-EMPI-017).
//
// Not decoration: the origin decides who may raise one, what the reviewer is
// being asked, and whether a repeat is a duplicate or a second independent
// claim.
enum ProposalOrigin {
  PROPOSAL_ORIGIN_UNSPECIFIED = 0;
  // A machine feed — a national registry, an HIE, a payer file.
  PROPOSAL_ORIGIN_EXTERNAL_SOURCE = 1;
  // A person asking for their record to be corrected.
  PROPOSAL_ORIGIN_CORRECTION_REQUEST = 2;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_OPEN = 1;
  PROPOSAL_STATUS_ACCEPTED = 2;
  // Refused in full, and kept. That a value was offered and refused is what
  // makes a third arrival of the same value a pattern rather than a surprise.
  PROPOSAL_STATUS_REJECTED = 3;
  PROPOSAL_STATUS_WITHDRAWN = 4;
  // Overtaken: the record changed underneath, so the comparison a reviewer
  // would be shown no longer holds.
  PROPOSAL_STATUS_SUPERSEDED = 5;
}

// Which demographic element a proposal changes.
enum DemographicField {
  DEMOGRAPHIC_FIELD_UNSPECIFIED = 0;
  DEMOGRAPHIC_FIELD_FAMILY_NAME = 1;
  DEMOGRAPHIC_FIELD_GIVEN_NAME = 2;
  DEMOGRAPHIC_FIELD_BIRTH_DATE = 3;
  DEMOGRAPHIC_FIELD_SEX = 4;
  DEMOGRAPHIC_FIELD_PHONE = 5;
  DEMOGRAPHIC_FIELD_EMAIL = 6;
  DEMOGRAPHIC_FIELD_ADDRESS = 7;
}

// One field's proposed change.
//
// Per field rather than a whole demographics message, because a registry that
// agrees on the name and disagrees on the birth date is offering one correction
// and one conflict, and a reviewer must be able to take the first without the
// second.
message ProposedFieldChange {
  DemographicField field = 1;
  // What was on file when the proposal was raised, stored rather than read at
  // review time: a value re-read later may have changed for an unrelated
  // reason, and the reviewer must see the comparison the proposer saw.
  string current_value = 2;
  string proposed_value = 3;
  // Set once decided. Unset while the proposal is open.
  optional bool accepted = 4;
}

message DemographicProposal {
  string proposal_id = 1;
  string patient_id = 2;
  ProposalOrigin origin = 3;
  // Which feed, or which person.
  string source = 4;
  string proposed_by = 5;
  string reason = 6;
  ProposalStatus status = 7;
  repeated ProposedFieldChange fields = 8;
  // The record's version when this was raised. A decision taken against a
  // record that has since moved is refused rather than applied.
  int64 patient_version = 9;
  google.protobuf.Timestamp proposed_at = 10;
  google.protobuf.Timestamp resolved_at = 11;
  string resolved_by = 12;
  string resolution_note = 13;
}

message SubmitExternalDemographicsRequest {
  string patient_id = 1;
  Demographics demographics = 2;
  // Which feed is claiming this. Required — SRS-EMPI-012 is about reconciling
  // disagreements between sources, and one with no source reconciles against
  // nothing.
  string source = 3;
  // Also propose values for fields the record leaves empty. A registry
  // offering a birth date the record lacks is filling a gap rather than
  // contradicting anything — still a proposal, because "usually welcome" is
  // not "always correct".
  bool fill_blanks = 4;
}

message SubmitExternalDemographicsResponse {
  // Set when the source disagreed. Unset when it agreed, which is the common
  // case and is not an error.
  DemographicProposal proposal = 1;
  bool conflicted = 2;
  // An existing open proposal from this source was refreshed rather than a
  // second one added. A nightly feed that keeps disagreeing must not add a
  // queue item every night.
  bool refreshed = 3;
}

message RequestCorrectionRequest {
  string patient_id = 1;
  Demographics demographics = 2;
  // What the reviewer is actually deciding on. "The spelling on my passport"
  // and "I would prefer a different name" are different requests with the same
  // proposed value.
  string reason = 3;
}

message RequestCorrectionResponse {
  DemographicProposal proposal = 1;
}

message ListDemographicProposalsRequest {
  // Empty lists the open worklist; a patient id lists everything ever proposed
  // about that patient, rejections included.
  string patient_id = 1;
  int32 page_size = 2;
}

message ListDemographicProposalsResponse {
  repeated DemographicProposal proposals = 1;
}

message ResolveDemographicProposalRequest {
  string proposal_id = 1;
  // The fields to apply. Empty is a full rejection, which is a real decision
  // and needs a note saying why: the same value will arrive again, and the next
  // reviewer needs to know this one was considered rather than missed.
  repeated DemographicField accept = 2;
  string note = 3;
}

message ResolveDemographicProposalResponse {
  DemographicProposal proposal = 1;
  // Set when at least one field was applied.
  Patient patient = 2;
}

message WithdrawDemographicProposalRequest {
  string proposal_id = 1;
  string note = 2;
}

message WithdrawDemographicProposalResponse {
  DemographicProposal proposal = 1;
}

// A patient whose identity is not yet known (SRS-EMPI-015).
//
// Deliberately not a HumanName. A record whose family name is "TRAUMA ALPHA"
// sorts into the name index, fuzzy-matches the next trauma patient, and prints
// on a wristband looking exactly like a name.
message TemporaryDesignation {
  // What staff say out loud and what prints on the band. Site convention, not
  // this system's invention.
  string label = 1;
  // What a clinician records at the bedside: an observation, not a claim about
  // identity. Frequently wrong and still worth recording, because a lab needs a
  // reference range before anybody knows who this is.
  Sex apparent_sex = 2;
  // Estimated years. Zero means nobody estimated one.
  int32 apparent_age = 3;
  // The free-text peg staff actually use to find the record again — "road
  // traffic collision, brought in by ambulance 14". Deliberately unstructured:
  // an enumeration of ways people arrive unconscious would be wrong within a
  // week.
  string circumstance = 4;
}

message RegisterUnidentifiedRequest {
  TemporaryDesignation designation = 1;
}

message RegisterUnidentifiedResponse {
  Patient patient = 1;
}

message IdentifyPatientRequest {
  string patient_id = 1;
  Demographics demographics = 2;
  int64 expected_version = 3;
  // Records the caller has been shown and judged to be different people.
  // Identification is exactly when the duplicate check that emergency
  // registration skipped has to happen: the patient now has a name, and an
  // existing record for them is likely.
  repeated string acknowledged_duplicate_patient_ids = 4;
}

message IdentifyPatientResponse {
  // Unset when duplicates need review first.
  Patient patient = 1;
  repeated PatientMatch potential_duplicates = 2;
}

message ListUnidentifiedRequest {
  int32 page_size = 1;
}

message ListUnidentifiedResponse {
  repeated Patient patients = 1;
}

// Consent to be photographed (SRS-EMPI-010).
//
// Its own message because consent has a shape: somebody gave it, at a time, for
// a stated purpose. A boolean records none of that, and "did this patient agree
// to their photograph being kept" is a question somebody will be asked to
// answer with evidence.
message PhotoConsent {
  // Who consented — the patient, or a related person holding the authority to
  // consent for them.
  string given_by = 1;
  // Set when somebody consented for the patient, naming the relationship that
  // permitted it.
  string on_behalf = 2;
  // What the photograph may be used for. "They agreed to a photo" is not
  // consent to anything in particular: identification at the bedside and
  // publication in a case report are both photographs of a patient.
  string purpose = 3;
  google.protobuf.Timestamp given_at = 4;
  string recorded_by = 5;
}

message PatientPhoto {
  string photo_id = 1;
  string patient_id = 2;
  string content_type = 3;
  int64 byte_size = 4;
  // SHA-256 of the bytes, hex-encoded, so a stored object can be shown to be
  // the one this record describes.
  string digest = 5;
  PhotoConsent consent = 6;
  google.protobuf.Timestamp captured_at = 7;
  string captured_by = 8;
  // Set when consent was withdrawn. The record stays and the bytes go: a
  // deletion that left nothing behind would leave nobody able to answer whether
  // a photograph ever existed.
  google.protobuf.Timestamp withdrawn_at = 9;
  string withdrawn_reason = 10;
}

message CapturePhotoRequest {
  string patient_id = 1;
  // image/jpeg, image/png or image/webp. An allowlist, not a blocklist: a
  // blocklist accepts SVG, which is a script container.
  string content_type = 2;
  // At most 2 MiB. The bytes come from a ward tablet, and an unbounded endpoint
  // is a way to fill a disk from the registration desk.
  bytes content = 3;
  PhotoConsent consent = 4;
}

message CapturePhotoResponse {
  PatientPhoto photo = 1;
}

message GetPhotoRequest {
  string patient_id = 1;
}

message GetPhotoResponse {
  // Unset when the patient has no photograph, which is an ordinary state
  // rather than an error.
  PatientPhoto photo = 1;
  bytes content = 2;
}

message WithdrawPhotoConsentRequest {
  string photo_id = 1;
  string reason = 2;
}

message WithdrawPhotoConsentResponse {
  PatientPhoto photo = 1;
}

message ConfigureFieldAccessRequest {
  // Empty applies to every facility in the jurisdiction; naming one overrides.
  string facility_id = 1;
  DemographicField field = 2;
  // The permission that reveals this field in full. A field restricted behind
  // no permission is restricted from everybody forever with nothing saying so.
  string required_permission = 3;
}

message ConfigureFieldAccessResponse {}

message LinkIdentifierRequest {
  string patient_id = 1;
  // The MRN is issued by this system from the facility's sequence and is not
  // linkable from outside: accepting one would let a caller pick a value the
  // sequence has not reached, and the next issue would collide.
  IdentifierType type = 2;
  string system = 3;
  string value = 4;
  string assigning_authority = 5;
  // Where this system learned the value. Required — SRS-EMPI-011 retains
  // source, and a link with no source cannot be unwound with any confidence
  // about what claimed it.
  string source = 6;
  // Ask the issuing authority to confirm the value, when a registry is
  // configured for this system.
  bool verify = 7;
  // Refuse the link unless the authority confirms it. Distinct from verify: a
  // desk that wants confirmation but will accept an asserted value during an
  // outage sets verify alone.
  bool require_verification = 8;
}

message LinkIdentifierResponse {
  PatientIdentifier identifier = 1;
  // False when no registry is configured for the system, which is a different
  // situation from an authority that was asked and declined.
  bool verification_attempted = 2;
  // The authority could not be reached. The identifier is linked as asserted.
  bool registry_unavailable = 3;
  // A negative answer's explanation.
  string verification_reason = 4;
  // What the issuing authority holds against the identifier, when it returned
  // anything. Never applied to the record here: a difference is a conflict for
  // reconciliation (SRS-EMPI-012), and silently overwriting trusted data with
  // a feed is the failure that requirement exists to prevent.
  Demographics authority_demographics = 5;
  bool has_authority_demographics = 6;
  // Set when the authority's demographics disagreed with the record and a
  // reconciliation proposal was raised (SRS-EMPI-012). The values are never
  // applied here: a registry can be wrong, and can be describing a different
  // person.
  string conflict_proposal_id = 7;
}

message UnlinkIdentifierRequest {
  string identifier_id = 1;
  // True when the identifier should never have pointed at this patient, as
  // opposed to having been correct and replaced. The difference decides whether
  // a search on the value still resolves here, so it is explicit rather than
  // inferred.
  bool revoke = 2;
  string reason = 3;
}

message UnlinkIdentifierResponse {
  // The retired identifier, not its absence: SRS-EMPI-011 retains unlink
  // history, and there is no delete on this path.
  PatientIdentifier identifier = 1;
}

message VerifyIdentifierRequest {
  string identifier_id = 1;
}

message VerifyIdentifierResponse {
  PatientIdentifier identifier = 1;
  Demographics authority_demographics = 2;
  bool has_authority_demographics = 3;
}

message DeceasedRecord {
  PartialDate date = 1;
  // Who says so: a registrar, a clinician, a national death registry feed. A
  // feed can be wrong about the wrong patient, and reversing it needs to know
  // what claimed it.
  string source = 2;
  google.protobuf.Timestamp recorded_at = 3;
  string recorded_by = 4;
}

message Patient {
  // Opaque, internal, immutable. Never printed, never quoted, never changed —
  // not by a merge, not by a correction (SRS-EMPI-002).
  string patient_id = 1;
  string registered_facility_id = 2;
  PatientStatus status = 3;
  Demographics demographics = 4;
  repeated PatientIdentifier identifiers = 5;
  // Set only on the losing side of a merge. Resolves a reference written
  // before it.
  string merged_into_patient_id = 6;
  DeceasedRecord deceased = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int64 version = 10;
  // True when the record is fit to receive a routine appointment. The identity
  // context answers the factual half; scheduling owns whether to warn or block
  // (SRS-EMPI-008).
  bool accepts_routine_scheduling = 11;
  // Set only on a patient registered unidentified (SRS-EMPI-015). Kept after
  // identification rather than cleared: an hour of records was filed under it.
  TemporaryDesignation designation = 12;
  // When real demographics replaced the designation. Unset while still unknown.
  google.protobuf.Timestamp identified_at = 13;
}

// What a duplicate score means operationally (SRS-EMPI-004).
//
// There is deliberately no outcome that means "merge". The strongest verdict
// this system produces is that a human should look: a missed duplicate shows a
// clinician half a history, while a wrong merge fuses two people's allergies
// and medications into one chart.
enum MatchOutcome {
  MATCH_OUTCOME_UNSPECIFIED = 0;
  MATCH_OUTCOME_DISTINCT = 1;
  // Possible duplicate; registration continues with the candidate shown.
  MATCH_OUTCOME_REVIEW = 2;
  // Likely duplicate; routes to manual review. Does NOT authorise a merge.
  MATCH_OUTCOME_PROBABLE = 3;
  // An identifier says these are different people whatever the demographics
  // suggest.
  MATCH_OUTCOME_CONFLICT = 4;
}

// One signal's contribution, so a score is reviewable rather than a bare
// number (SRS-EMPI-003).
message MatchFieldScore {
  string field = 1;
  // 0..1, or negative when the signal says these are different people.
  double similarity = 2;
  double weight = 3;
  // Short, non-PHI explanation such as "year only" or "names appear
  // transposed".
  string note = 4;
}

message PatientMatch {
  Patient patient = 1;
  double confidence = 2;
  MatchOutcome outcome = 3;
  repeated MatchFieldScore fields = 4;
  // True when protected fields were masked for this caller. The UI says so
  // rather than showing blanks that read as missing data.
  bool masked = 5;
  // Set when this patient was reached through a name they no longer hold
  // (SRS-EMPI-007). A match on a maiden name scores low against the current
  // name, so without this the row reads as an irrelevant result and is
  // dismissed — which is the outcome the history exists to prevent.
  PatientName matched_former_name = 6;
}

message RegisterPatientRequest {
  Demographics demographics = 1;
  // Identifiers the patient already holds — a national health identifier, a
  // card from another facility. The MRN is issued by this system and must not
  // be supplied here.
  repeated PatientIdentifier identifiers = 2;
  // Acknowledges duplicates already shown to the user. Registration refuses a
  // probable duplicate unless the caller has seen it and said to proceed,
  // which is what makes search-before-create a control rather than a courtesy.
  repeated string acknowledged_duplicate_patient_ids = 3;
}

// Exactly one of these is populated.
//
// Finding a probable duplicate is an expected outcome of search-before-create,
// not a failure, so it comes back as a successful response with `patient`
// empty and `potential_duplicates` set. Returning an error instead would be
// truthful about the outcome and useless in practice: Connect discards the
// response body on an error, so the caller would be told to review candidates
// it cannot see, and would have to search again to find them.
//
// A client checks `patient`: set means registered, empty means review the
// candidates and either correct the details or re-send with the patient ids in
// acknowledged_duplicate_patient_ids.
message RegisterPatientResponse {
  Patient patient = 1;
  // Set when registration did not proceed because a probable duplicate needs
  // review. Empty on success.
  repeated PatientMatch potential_duplicates = 2;
}

message SearchPatientsRequest {
  // Free-text name fragment, matched case-insensitively.
  string name = 1;
  PartialDate birth_date = 2;
  string phone = 3;
  // Exact identifier lookup. Finds superseded identifiers too, because a
  // patient quoting an old card must still be found.
  string identifier_value = 4;
  IdentifierType identifier_type = 5;
  // Namespaces the value. Required for every type except MRN, which is
  // namespaced by the facility that issued it — two insurers both issue
  // membership numbers, and without the namespace they collide.
  string identifier_system = 6;
  int32 page_size = 7;
  // Opaque cursor, never a page number.
  string page_token = 8;
}

message SearchPatientsResponse {
  repeated PatientMatch matches = 1;
  string next_page_token = 2;
}

message GetPatientRequest {
  string patient_id = 1;
  // Follows merged records to the survivor. Default false, so a caller that
  // means "this exact record" gets it.
  bool resolve_merged = 2;
}

message GetPatientResponse {
  Patient patient = 1;
  // Set when resolve_merged followed a merge, naming the record asked for.
  string resolved_from_patient_id = 2;
  bool masked = 3;
}

message UpdateDemographicsRequest {
  string patient_id = 1;
  Demographics demographics = 2;
  // Optimistic concurrency: two clerks correcting one record at the same desk
  // is routine.
  int64 expected_version = 3;
}

message UpdateDemographicsResponse {
  Patient patient = 1;
}

// What was actually checked before confirming a patient's identity
// (SRS-EMPI-010).
//
// Evidence rather than a bare confirmation: the requirement prohibits a
// photograph from being the sole identity proof and requires the workflow to
// include a configured positive identifier, and neither is checkable against a
// call that says only that somebody clicked a button.
message IdentityEvidence {
  // The identifiers that were sighted and checked. Only a *verified* one
  // counts: a number read off a photocopy carries no more assurance than the
  // photograph does.
  repeated string identifier_ids = 1;
  // A human compared the patient with the stored photograph. Useful, and never
  // sufficient — face comparison fails hardest for siblings, twins, an old
  // photo, and measurably by skin tone and age, which concentrates its errors
  // on the people least able to contest them.
  bool photo_matched = 2;
  // A related person identified the patient. Also never sufficient alone.
  string vouched_for_by = 3;
  string note = 4;
}

message ConfirmIdentityRequest {
  string patient_id = 1;
  int64 expected_version = 2;
  // What was checked. Confirmation is refused unless it includes a sighted,
  // verified identifier (SRS-EMPI-010).
  IdentityEvidence evidence = 3;
}

message ConfirmIdentityResponse {
  Patient patient = 1;
}

// Where a duplicate pair sits in review (SRS-EMPI-004).
enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_OPEN = 1;
  REVIEW_STATUS_MERGED = 2;
  // Judged to be two different people. Recorded rather than deleted, so the
  // same pair does not return to the queue every time either record is
  // touched.
  REVIEW_STATUS_DISMISSED = 3;
}

// One pair awaiting or past review.
//
// The queue exists because "thresholds route to manual review" needs somewhere
// to route to. A clerk who acknowledges a probable duplicate and registers
// anyway has made that call at a busy desk with a patient waiting; the pair
// still goes to the people whose job it is.
message DuplicateCandidate {
  string candidate_id = 1;
  string patient_a_id = 2;
  string patient_b_id = 3;
  double score = 4;
  MatchOutcome outcome = 5;
  ReviewStatus status = 6;
  // What surfaced the pair: a registration, a bulk scan, an operator. It
  // matters when deciding how much to trust the score.
  string detected_by = 7;
  google.protobuf.Timestamp detected_at = 8;
  string reviewed_by = 9;
  google.protobuf.Timestamp reviewed_at = 10;
  // Explains a dismissal, or names the merge that resolved it.
  string resolution = 11;
}

message MergePatientsRequest {
  // The record that keeps its patient id and its MRN. Which one survives is
  // the reviewer's decision — usually the one carrying the clinical history —
  // and it is never inferred.
  string survivor_patient_id = 1;
  string merged_patient_id = 2;
  // Required. A merge with no reason cannot be reviewed afterwards, and that
  // review is the only thing between a mistake and two people's records.
  string reason = 3;
  // Closes the review-queue entry this merge came from, when there is one.
  string candidate_id = 4;
}

message MergePatientsResponse {
  Patient survivor = 1;
  string merged_patient_id = 2;
  // Names the journal entry an unmerge would reverse.
  string merge_id = 3;
}

message UnmergePatientsRequest {
  string merge_id = 1;
  string reason = 2;
}

message UnmergePatientsResponse {
  Patient survivor = 1;
  Patient restored = 2;
}

message ListDuplicateCandidatesRequest {
  int32 page_size = 1;
}

message ListDuplicateCandidatesResponse {
  // Strongest first: the pair most likely to be one person, and the one whose
  // being wrong costs the most.
  repeated DuplicateCandidate candidates = 1;
}

message DismissDuplicateCandidateRequest {
  string candidate_id = 1;
  // Required. A dismissal with no reason is indistinguishable from a mis-click,
  // and the pair never returns to the queue to be reconsidered.
  string reason = 2;
}

message DismissDuplicateCandidateResponse {}

// What a recorded name is for (SRS-EMPI-007).
enum NameKind {
  NAME_KIND_UNSPECIFIED = 0;
  // The name on the identity document.
  NAME_KIND_LEGAL = 1;
  // What the patient asks to be called. Shown on a worklist; never printed on
  // a legal document, and never a replacement for the one on the paperwork.
  NAME_KIND_PREFERRED = 2;
  // Another name they are known by — a maiden name, a religious name, a
  // transliteration.
  NAME_KIND_ALIAS = 3;
}

// A half-open interval [from, until). Until unset means open-ended.
//
// Half-open because closed intervals make the changeover day ambiguous, and
// somebody always ends up in both.
message EffectiveWindow {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp until = 2;
}

// One name, effective-dated.
//
// Names are never overwritten. A patient marries, the surname changes, and six
// months later a result addressed to the maiden name arrives — a clerk who
// cannot find that name creates a second record, which is the failure this
// history prevents.
message PatientName {
  string name_id = 1;
  NameKind kind = 2;
  HumanName name = 3;
  EffectiveWindow window = 4;
  string recorded_by = 5;
  google.protobuf.Timestamp recorded_at = 6;
  string source = 7;
}

enum CommunicationChannel {
  COMMUNICATION_CHANNEL_UNSPECIFIED = 0;
  COMMUNICATION_CHANNEL_SMS = 1;
  COMMUNICATION_CHANNEL_EMAIL = 2;
  COMMUNICATION_CHANNEL_PHONE = 3;
  COMMUNICATION_CHANNEL_POST = 4;
}

// What a message is about.
//
// Held separately from the channel because the answers differ: a patient who
// wants appointment reminders by SMS may want nothing else by SMS, and treating
// "reachable by SMS" as one setting is how a hospital texts somebody their test
// results.
enum CommunicationPurpose {
  COMMUNICATION_PURPOSE_UNSPECIFIED = 0;
  COMMUNICATION_PURPOSE_APPOINTMENT_REMINDER = 1;
  COMMUNICATION_PURPOSE_RESULTS = 2;
  COMMUNICATION_PURPOSE_BILLING = 3;
  COMMUNICATION_PURPOSE_HEALTH_PROMOTION = 4;
}

message CommunicationPreference {
  string preference_id = 1;
  CommunicationChannel channel = 2;
  CommunicationPurpose purpose = 3;
  // false is a recorded refusal, which is not the same as an absent row: one
  // says the patient declined, the other says nobody asked.
  bool allowed = 4;
  EffectiveWindow window = 5;
  string recorded_by = 6;
}

enum RelationshipType {
  RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  RELATIONSHIP_TYPE_PARENT = 1;
  RELATIONSHIP_TYPE_GUARDIAN = 2;
  RELATIONSHIP_TYPE_SPOUSE = 3;
  RELATIONSHIP_TYPE_CHILD = 4;
  RELATIONSHIP_TYPE_SIBLING = 5;
  RELATIONSHIP_TYPE_CAREGIVER = 6;
  // Somebody to telephone. Carries no authority over the record, which is why
  // it is a distinct type rather than a caregiver with an empty scope.
  RELATIONSHIP_TYPE_EMERGENCY_CONTACT = 7;
}

// One thing a related person may do (SRS-EMPI-009).
//
// Scoped rather than all-or-nothing: the parent who brings a child to an
// appointment needs to book it and be told the time, and does not by that fact
// need the child's psychiatric notes.
enum Authority {
  AUTHORITY_UNSPECIFIED = 0;
  AUTHORITY_VIEW_DEMOGRAPHICS = 1;
  AUTHORITY_BOOK_APPOINTMENTS = 2;
  AUTHORITY_VIEW_CLINICAL = 3;
  AUTHORITY_RECEIVE_RESULTS = 4;
  AUTHORITY_CONSENT = 5;
}

message RelatedPerson {
  string relationship_id = 1;
  // Set when the related person is themselves a patient here, which a parent
  // usually is.
  string related_patient_id = 2;
  // Used when they are not — a care-home key worker will never have a record.
  HumanName name = 3;
  repeated ContactPoint contact = 4;

  RelationshipType relationship = 5;
  repeated Authority authorities = 6;
  EffectiveWindow window = 7;

  // An unverified relationship carries no authority. "I am her son" is a
  // sentence anybody can say at a reception desk.
  string verified_by = 8;
  google.protobuf.Timestamp verified_at = 9;
  // What was actually checked — a birth certificate, a court order — rather
  // than merely that something was.
  string verification_note = 10;
  string recorded_by = 11;
}

message RecordNameRequest {
  string patient_id = 1;
  NameKind kind = 2;
  HumanName name = 3;
  // When the name started applying — a marriage date, a deed poll — not when
  // somebody got round to typing it. Unset means now.
  google.protobuf.Timestamp effective_from = 4;
  string source = 5;
}

message RecordNameResponse {}

message GetPatientHistoryRequest {
  string patient_id = 1;
}

message GetPatientHistoryResponse {
  repeated PatientName names = 1;
  repeated CommunicationPreference preferences = 2;
  repeated RelatedPerson related = 3;
}

message RecordCommunicationPreferenceRequest {
  string patient_id = 1;
  CommunicationChannel channel = 2;
  CommunicationPurpose purpose = 3;
  bool allowed = 4;
  google.protobuf.Timestamp effective_from = 5;
}

message RecordCommunicationPreferenceResponse {}

message RecordDeceasedRequest {
  string patient_id = 1;
  PartialDate date = 2;
  // Required: a registrar, a clinician, a national death registry feed. A feed
  // can be wrong about the wrong patient, and reversing it needs to know what
  // claimed it.
  string source = 3;
}

message RecordDeceasedResponse {
  Patient patient = 1;
}

message ReverseDeceasedRequest {
  string patient_id = 1;
  string reason = 2;
}

message ReverseDeceasedResponse {
  Patient patient = 1;
}

message AddRelatedPersonRequest {
  string patient_id = 1;
  string related_patient_id = 2;
  HumanName name = 3;
  repeated ContactPoint contact = 4;
  RelationshipType relationship = 5;
  repeated Authority authorities = 6;
  google.protobuf.Timestamp effective_from = 7;
  // When the authority ends. A guardian's ends on a date everybody can
  // predict, and a relationship with no end is a standing grant nobody
  // revisits.
  google.protobuf.Timestamp effective_until = 8;
}

message AddRelatedPersonResponse {
  RelatedPerson related = 1;
}

message VerifyRelatedPersonRequest {
  string relationship_id = 1;
  // Required, and it must say what was checked.
  string note = 2;
}

message VerifyRelatedPersonResponse {}

message EndRelatedPersonRequest {
  string relationship_id = 1;
}

message EndRelatedPersonResponse {}

message GetCaregiverAuthorityRequest {
  // The person asking to act.
  string holder_patient_id = 1;
  // The patient they want to act for.
  string subject_patient_id = 2;
}

message GetCaregiverAuthorityResponse {
  // What they may do right now: verified, in force, and in scope. Empty means
  // nothing, which is also the answer for an unverified or expired
  // relationship.
  repeated Authority authorities = 1;
}

// Patient identity (SRS-EMPI).
service PatientService {
  // SRS-EMPI-001. Issues the MRN from the registering facility's sequence.
  rpc RegisterPatient(RegisterPatientRequest) returns (RegisterPatientResponse);
  // SRS-EMPI-003. Search before create, exact and fuzzy, with confidence.
  rpc SearchPatients(SearchPatientsRequest) returns (SearchPatientsResponse);
  rpc GetPatient(GetPatientRequest) returns (GetPatientResponse);
  rpc UpdateDemographics(UpdateDemographicsRequest) returns (UpdateDemographicsResponse);
  // Moves a candidate to active once a positive identifier has been seen.
  rpc ConfirmIdentity(ConfirmIdentityRequest) returns (ConfirmIdentityResponse);

  // SRS-EMPI-005. Merging is the most destructive operation here: a merge that
  // should not have happened produces a chart that reads as coherent, and is
  // found by a reaction rather than by a report. Restricted to authorised HIM.
  rpc MergePatients(MergePatientsRequest) returns (MergePatientsResponse);
  // SRS-EMPI-006. Reverses a merge, or refuses with the reason it cannot.
  rpc UnmergePatients(UnmergePatientsRequest) returns (UnmergePatientsResponse);
  // SRS-EMPI-004. The manual-review worklist thresholds route to.
  rpc ListDuplicateCandidates(ListDuplicateCandidatesRequest) returns (ListDuplicateCandidatesResponse);
  rpc DismissDuplicateCandidate(DismissDuplicateCandidateRequest) returns (DismissDuplicateCandidateResponse);

  // SRS-EMPI-015. An unconscious patient is registered immediately, with a
  // designation instead of a name, and identified later. The internal
  // identifier never changes, so everything written during the emergency still
  // points at the same record — which is what "without losing encounter
  // chronology" means in practice.
  rpc RegisterUnidentified(RegisterUnidentifiedRequest) returns (RegisterUnidentifiedResponse);
  rpc IdentifyPatient(IdentifyPatientRequest) returns (IdentifyPatientResponse);
  rpc ListUnidentified(ListUnidentifiedRequest) returns (ListUnidentifiedResponse);

  // SRS-EMPI-010. A photograph is held with the consent it was taken under and
  // is never sufficient to establish identity on its own.
  rpc CapturePhoto(CapturePhotoRequest) returns (CapturePhotoResponse);
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
  rpc WithdrawPhotoConsent(WithdrawPhotoConsentRequest) returns (WithdrawPhotoConsentResponse);

  // SRS-EMPI-014. Which demographic fields are restricted is a tenant
  // decision, not a constant in this system.
  rpc ConfigureFieldAccess(ConfigureFieldAccessRequest) returns (ConfigureFieldAccessResponse);

  // SRS-EMPI-011. External identifiers are linked and unlinked through an
  // adapter; neither direction deletes a row, because link and unlink history
  // is what makes a wrong link investigable.
  rpc LinkIdentifier(LinkIdentifierRequest) returns (LinkIdentifierResponse);
  rpc UnlinkIdentifier(UnlinkIdentifierRequest) returns (UnlinkIdentifierResponse);
  // Confirms an identifier linked while the issuing authority was unreachable.
  rpc VerifyIdentifier(VerifyIdentifierRequest) returns (VerifyIdentifierResponse);

  // SRS-EMPI-012. An external source that disagrees with the record raises a
  // proposal; it never writes. A feed that can overwrite demographics will
  // eventually overwrite the right value with the wrong one, and nothing will
  // record what was lost.
  rpc SubmitExternalDemographics(SubmitExternalDemographicsRequest) returns (SubmitExternalDemographicsResponse);
  // SRS-EMPI-017. A person asks for a correction; a reviewer decides. Raising
  // needs only read access, because the person asking is often the patient.
  rpc RequestCorrection(RequestCorrectionRequest) returns (RequestCorrectionResponse);
  rpc ListDemographicProposals(ListDemographicProposalsRequest) returns (ListDemographicProposalsResponse);
  // Applying or refusing is where the authority lives: deciding a proposal
  // needs the permission to change demographics, because that is what it does.
  rpc ResolveDemographicProposal(ResolveDemographicProposalRequest) returns (ResolveDemographicProposalResponse);
  rpc WithdrawDemographicProposal(WithdrawDemographicProposalRequest) returns (WithdrawDemographicProposalResponse);

  // SRS-EMPI-007. Names, preferences and relationships, effective-dated.
  rpc RecordName(RecordNameRequest) returns (RecordNameResponse);
  rpc GetPatientHistory(GetPatientHistoryRequest) returns (GetPatientHistoryResponse);
  rpc RecordCommunicationPreference(RecordCommunicationPreferenceRequest) returns (RecordCommunicationPreferenceResponse);

  // SRS-EMPI-008. Recording a death stops routine scheduling; withdrawing one
  // exists because a registry feed can match the wrong record, and a system
  // that cannot undo it leaves somebody unable to book an appointment because
  // a computer believes they are dead.
  rpc RecordDeceased(RecordDeceasedRequest) returns (RecordDeceasedResponse);
  rpc ReverseDeceased(ReverseDeceasedRequest) returns (ReverseDeceasedResponse);

  // SRS-EMPI-009. Caregiver relationships, scoped and expiring.
  rpc AddRelatedPerson(AddRelatedPersonRequest) returns (AddRelatedPersonResponse);
  rpc VerifyRelatedPerson(VerifyRelatedPersonRequest) returns (VerifyRelatedPersonResponse);
  rpc EndRelatedPerson(EndRelatedPersonRequest) returns (EndRelatedPersonResponse);
  rpc GetCaregiverAuthority(GetCaregiverAuthorityRequest) returns (GetCaregiverAuthorityResponse);
}
