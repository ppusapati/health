version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema:
      - db/migrations/0001_schemas.up.sql
      - db/migrations/0002_organization.up.sql
      - db/migrations/0003_platform_data.up.sql
      - db/migrations/0004_platform_workflow.up.sql
      - db/migrations/0005_edge.up.sql
      - db/migrations/0006_security.up.sql
      - db/migrations/0007_emergency_access.up.sql
      - db/migrations/0008_organization_master_data.up.sql
      - db/migrations/0009_identity_access.up.sql
      - db/migrations/0010_event_delivery.up.sql
    gen:
      go:
        package: sqlcgen
        out: internal/platform/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: jsonb
            go_type:
              type: "[]byte"
