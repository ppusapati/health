version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema:
      - db/migrations/0001_schemas.up.sql
      - db/migrations/0002_organization.up.sql
      - db/migrations/0003_platform_data.up.sql
      - db/migrations/0004_platform_workflow.up.sql
      - db/migrations/0005_edge.up.sql
      - db/migrations/0006_security.up.sql
      - db/migrations/0007_emergency_access.up.sql
      - db/migrations/0008_organization_master_data.up.sql
      - db/migrations/0009_identity_access.up.sql
      - db/migrations/0010_event_delivery.up.sql
      - db/migrations/0011_empi.up.sql
      - db/migrations/0012_empi_merge.up.sql
      - db/migrations/0013_empi_history.up.sql
      - db/migrations/0014_empi_identifier_assurance.up.sql
      - db/migrations/0015_empi_proposals.up.sql
      - db/migrations/0016_empi_photo_access_unidentified.up.sql
      - db/migrations/0017_scheduling.up.sql
      - db/migrations/0018_scheduling_lifecycle.up.sql
      - db/migrations/0019_scheduling_queue.up.sql
      - db/migrations/0020_encounter.up.sql
      - db/migrations/0021_clinical.up.sql
      - db/migrations/0022_nursing.up.sql
      - db/migrations/0023_orders.up.sql
      - db/migrations/0024_medication.up.sql
      - db/migrations/0025_billing.up.sql
      - db/migrations/0026_platform_blob.up.sql
      - db/migrations/0027_platform_escalation.up.sql
    gen:
      go:
        package: sqlcgen
        out: internal/platform/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: jsonb
            go_type:
              type: "[]byte"
